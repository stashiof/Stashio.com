<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <title>Estimate & Quotation Hub - Poysha POS</title>
    
    <meta name="theme-color" content="#f59e0b">
    <script>
        const activeShopId = localStorage.getItem('activeShopId');
        if (!activeShopId) window.location.replace("dashboard.html");
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root { 
            --primary: #f59e0b; --secondary: #d97706; --primary-dark: #b45309; 
            --bg-color: #f8fafc; --white: #ffffff; --text-dark: #1e293b; --text-light: #64748b; 
            --danger: #ef4444; --success: #10b981; --blue: #3b82f6; --purple: #8b5cf6;
            --border-radius: 18px; --shadow: 0 4px 20px rgba(0,0,0,0.06); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding-bottom: 40px; position: relative; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Header Area */
        .app-header { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); 
            padding: 22px 20px 48px 20px; color: white; border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; 
            position: sticky; top: 0; z-index: 50; box-shadow: 0 8px 25px rgba(245, 158, 11, 0.25); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .header-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: inherit; z-index: 1; }
        #dynamicThemeContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        .header-title { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; position: relative; z-index: 10; }
        .header-title a { color: white; text-decoration: none; }
        
        .header-actions { display: flex; gap: 8px; position: relative; z-index: 10; }
        .btn-header { background: rgba(255,255,255,0.22); border: none; padding: 8px 12px; border-radius: 12px; color: white; font-size: 12px; font-weight: 700; cursor: pointer; backdrop-filter: blur(6px); display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-header:active { transform: scale(0.95); }
        
        /* Search Box */
        .search-container { margin: -25px 15px 15px 15px; display: flex; gap: 10px; position: relative; z-index: 60; }
        .search-box { flex: 1; position: relative; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .search-box input { width: 100%; padding: 13px 15px 13px 40px; border-radius: 16px; border: 1px solid #e2e8f0; outline: none; box-shadow: var(--shadow); font-size: 13px; font-family: inherit; background: var(--white); color: var(--text-dark); }
        .search-box input:focus { border-color: var(--primary); }
        .btn-scan { background: var(--text-dark); color: white; width: 48px; border-radius: 16px; border: none; box-shadow: var(--shadow); cursor: pointer; font-size: 18px; transition: 0.2s; }
        .btn-scan:active { transform: scale(0.95); }

        /* Client Details Card */
        .client-card { background: var(--white); border-radius: var(--border-radius); padding: 16px; margin: 0 15px 15px 15px; box-shadow: var(--shadow); border: 1px solid #f1f5f9; }
        .section-label { font-size: 11px; font-weight: 800; color: var(--text-light); text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 8px; }
        .input-group label { font-size: 10px; font-weight: 700; color: var(--text-light); margin-bottom: 4px; text-transform: uppercase; }
        .input-group input, .input-group select { padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 12px; font-family: inherit; outline: none; background: #f8fafc; }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); background: white; }

        /* Product Selector Grid */
        .product-picker { padding: 0 15px; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .product-card { background: var(--white); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; transition: 0.2s; cursor: pointer; }
        .product-card:active { transform: scale(0.98); }
        .product-card.in-cart { border-color: var(--primary); background: #fffbeb; }
        .product-img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; background: #f8fafc; border: 1px solid #f1f5f9; }
        .product-info { flex: 1; min-width: 0; }
        .product-name { font-size: 13px; font-weight: 700; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-meta { font-size: 10.5px; color: var(--text-light); margin-top: 2px; }
        .cart-toggle-btn { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: var(--text-light); font-size: 12px; }
        .product-card.in-cart .cart-toggle-btn { background: var(--primary); color: white; }

        /* Estimate Item Cards */
        .cart-container { padding: 0 15px; display: flex; flex-direction: column; gap: 10px; }
        .cart-item { background: white; padding: 14px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid #f1f5f9; }
        .item-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 8px; font-size: 13px; color: var(--text-dark); }
        .item-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .input-box { display: flex; flex-direction: column; }
        .input-box label { font-size: 9.5px; color: var(--text-light); font-weight: 700; margin-bottom: 2px; text-transform: uppercase; }
        .input-box input { padding: 8px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 12px; font-weight: bold; width: 100%; text-align: center; outline: none; }
        .input-box input:focus { border-color: var(--primary); }
        .input-box input.buy { color: var(--danger); border-color: #fca5a5; background: #fef2f2; }
        .input-box input.sell { color: var(--success); border-color: #86efac; background: #f0fdf4; }

        /* Summary Card */
        .summary-card { background: white; margin: 15px; padding: 18px; border-radius: var(--border-radius); box-shadow: var(--shadow); border: 2px solid var(--primary); }
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .summary-row.profit { font-size: 16px; font-weight: 800; color: var(--success); border-top: 1px dashed #e2e8f0; padding-top: 10px; margin-top: 10px; }

        /* Action Grid */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 15px 30px 15px; }
        .btn-action { padding: 13px; border: none; border-radius: 14px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-action:active { transform: scale(0.98); }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: white; width: 100%; max-width: 420px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .btn-close { background: white; border: 1px solid #e5e7eb; width: 30px; height: 30px; border-radius: 50%; color: var(--text-light); cursor: pointer; }
        
        .saved-list { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .saved-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; background: #f8fafc; }
        .sc-title { font-size: 13.5px; font-weight: 800; color: var(--text-dark); margin-bottom: 3px; }
        .sc-date { font-size: 10.5px; color: var(--text-light); margin-bottom: 8px; }
        .sc-actions { display: flex; gap: 8px; }
        .sc-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

        #scannerModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #reader { width: 100%; max-width: 320px; border-radius: 20px; overflow: hidden; border: 3px solid var(--primary); }
        .btn-close-scanner { margin-top: 25px; background: white; color: var(--danger); border: none; padding: 10px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; }

        /* Clean Printable Layout */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .no-print { display: none !important; }
            #printAreaHolder { display: block !important; }
            #printAreaHolder table { width: 100% !important; border-collapse: collapse !important; }
            #printAreaHolder thead { display: table-header-group !important; }
            #printAreaHolder tfoot { display: table-row-group !important; }
            #printAreaHolder tr { page-break-inside: avoid !important; break-inside: avoid !important; }
            #printAreaHolder th, #printAreaHolder td { border: 1px solid #000000 !important; padding: 6px 8px !important; font-size: 11px !important; color: black !important; }
            #printAreaHolder th { background: #f8fafc !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-signatures { page-break-inside: avoid !important; margin-top: 35px; display: flex; justify-content: space-between; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="app-header no-print">
        <div class="header-bg"></div>
        <div id="dynamicThemeContainer"></div>
        <div class="header-title">
            <a href="home.html"><i class="fas fa-arrow-left"></i></a>
            <span>Estimate & Quotation</span>
        </div>
        <div class="header-actions">
            <button onclick="openSavedModal()" class="btn-header"><i class="fas fa-list-alt"></i> Saved List</button>
        </div>
    </div>

    <!-- Search / Picker -->
    <div class="search-container no-print">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search inventory by name, brand or scan barcode...">
        </div>
        <button onclick="startScanner()" class="btn-scan"><i class="fas fa-barcode"></i></button>
    </div>

    <div id="loading" class="no-print" style="text-align: center; padding: 15px; color: var(--text-light); font-size: 12px;">
        <i class="fas fa-spinner fa-spin text-primary" style="font-size: 20px; margin-bottom: 6px;"></i><br>Loading Products...
    </div>

    <!-- Product Fast Picker -->
    <div class="product-picker no-print" id="productGrid"></div>

    <!-- Client Details Section -->
    <div class="client-card no-print">
        <div class="section-label"><i class="fas fa-user-tag text-primary"></i> Client & Quotation Info</div>
        <div class="grid-2">
            <div class="input-group">
                <label>Client / Customer Name *</label>
                <input type="text" id="qClientName" placeholder="e.g. Rahim Traders" list="customerSuggestions" autocomplete="off">
                <datalist id="customerSuggestions"></datalist>
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="qClientPhone" placeholder="01XXXXXXXXX">
            </div>
        </div>
        <div class="grid-2">
            <div class="input-group">
                <label>Quotation Date</label>
                <input type="date" id="qDate">
            </div>
            <div class="input-group">
                <label>Valid Until</label>
                <input type="date" id="qValidUntil">
            </div>
        </div>
        <div class="input-group" style="margin-bottom:0;">
            <label>Notes / Terms (Optional)</label>
            <input type="text" id="qNotes" placeholder="e.g. Delivery within 3 days, 50% advance">
        </div>
    </div>

    <!-- Items In Quotation -->
    <div style="padding: 0 15px; margin-bottom: 8px; font-weight: 800; color: var(--primary-dark); font-size: 12px; display: flex; justify-content: space-between; align-items: center;" class="no-print">
        <span><i class="fas fa-clipboard-list"></i> ITEMS IN QUOTATION (<span id="cartCount">0</span>):</span>
        <span id="currentStatusBadge" style="background:#fef3c7; color:#b45309; padding:2px 8px; border-radius:6px; font-size:10px; display:none;"></span>
    </div>
    
    <div class="cart-container no-print" id="cartList">
        <div style="text-align: center; color: #9ca3af; padding: 25px 0; font-size: 12px; border: 1px dashed #cbd5e1; border-radius: 14px;">
            <i class="fas fa-hand-pointer" style="font-size:20px; margin-bottom:6px; opacity:0.6;"></i><br>
            উপরে দেওয়া পণ্য তালিকায় ক্লিক করে এখানে আইটেম যুক্ত করুন।
        </div>
    </div>

    <!-- Summary Card -->
    <div class="summary-card no-print">
        <div class="summary-row"><span>Total Market Cost (Buy):</span> <span id="sumBuy" style="color: var(--danger);">৳0</span></div>
        <div class="summary-row"><span>Subtotal Client Bill:</span> <span id="sumSubtotal">৳0</span></div>
        
        <div class="grid-2" style="margin: 8px 0; border-top: 1px dashed #e2e8f0; padding-top: 8px;">
            <div class="input-group" style="margin-bottom:0;">
                <label>Discount (৳)</label>
                <input type="number" id="discountInput" value="0" oninput="calculateSummary()" style="padding:6px; font-size:12px; text-align:right;">
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>Delivery / Extra (৳)</label>
                <input type="number" id="extraChargeInput" value="0" oninput="calculateSummary()" style="padding:6px; font-size:12px; text-align:right;">
            </div>
        </div>

        <div class="summary-row" style="font-size:15px; font-weight:800; margin-top:6px;"><span>Net Client Total:</span> <span id="sumSell" style="color:var(--text-dark);">৳0</span></div>
        <div class="summary-row profit">
            <span>Estimated Profit:</span>
            <span id="sumProfit">৳0 (0%)</span>
        </div>
    </div>

    <!-- Actions Hub -->
    <div class="action-grid no-print">
        <button class="btn-action" style="background: var(--success); color: white; grid-column: span 2;" onclick="saveQuotation()"><i class="fas fa-save"></i> Save / Update Quotation</button>
        <button class="btn-action" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white;" onclick="printDirectQuotation('client')"><i class="fas fa-print"></i> Print Client Copy</button>
        <button class="btn-action" style="background: #e0e7ff; color: #0B4A3E;" onclick="printDirectQuotation('internal')"><i class="fas fa-chart-pie"></i> Cost Audit Sheet</button>
        <button class="btn-action" style="background: #16a34a; color: white;" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Export Excel</button>
        <button class="btn-action" style="background: #25d366; color: white;" onclick="shareViaWhatsApp()"><i class="fab fa-whatsapp"></i> Share WhatsApp</button>
        <button class="btn-action" style="background: linear-gradient(135deg, #f59e0b, #ea580c); color: white; grid-column: span 2;" onclick="convertToSale()"><i class="fas fa-cash-register"></i> Convert to Sale (এই দামে বিক্রি করুন)</button>
        <button class="btn-action" style="background: #fee2e2; color: var(--danger); grid-column: span 2;" onclick="clearEstimate()"><i class="fas fa-trash-alt"></i> Clear All</button>
    </div>

    <!-- Saved Quotations Modal -->
    <div class="modal-overlay no-print" id="savedModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0; font-size: 15px; font-weight:800;"><i class="fas fa-folder-open text-primary"></i> Saved Quotations</h3>
                <button onclick="closeSavedModal()" class="btn-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="saved-list" id="savedQuotesList">
                <div style="text-align: center; padding: 25px; color: #9ca3af;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
            </div>
        </div>
    </div>

    <div id="scannerModal">
        <div id="reader"></div>
        <button onclick="stopScanner()" class="btn-close-scanner">Close Camera</button>
    </div>

    <!-- Clean Printable Container -->
    <div id="printAreaHolder" style="display:none;"></div>

    <script type="module">
        import { rtdb, ref as rtdbRef, get, onValue as rtdbOnValue, push, update, remove } from './firebase_config.js';
        import { query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        import { getShopBranding, numberToWordsBDT } from './invoice_kit.js';

        const SHOP_ID = localStorage.getItem('activeShopId');
        const SHOP_NAME = localStorage.getItem('activeShopName') || "Poysha POS Store";
        
        let allProducts = [];
        let allCustomers = [];
        let estimateCart = {};
        let html5QrcodeScanner = null;

        let editingQuoteId = null;
        let allSavedQuotes = [];

        function safeKey(name) { return name.trim().replace(/[.#$\[\]\/]/g, '_'); }

        window.onload = () => {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('qDate').value = todayStr;
            const nextWeek = new Date(); nextWeek.setDate(nextWeek.getDate() + 7);
            document.getElementById('qValidUntil').value = nextWeek.toISOString().split('T')[0];

            // Load Inventory
            const productsQuery = query(rtdbRef(rtdb, 'product_list'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(productsQuery, (snap) => {
                document.getElementById('loading').style.display = 'none';
                if(snap.exists()) {
                    allProducts = Object.entries(snap.val())
                        .map(([id, val]) => ({ id, ...val }))
                        .filter(p => !p.is_deleted);
                    applySearch(''); 
                } else {
                    document.getElementById('productGrid').innerHTML = '<div style="text-align:center; padding: 20px; color:#9ca3af;">No products found.</div>';
                }
            });

            // Load Customers for Datalist
            const custQuery = query(rtdbRef(rtdb, 'contacts/customers'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(custQuery, (snap) => {
                const dl = document.getElementById('customerSuggestions');
                dl.innerHTML = '';
                allCustomers = [];
                if(snap.exists()) {
                    Object.values(snap.val()).forEach(c => {
                        allCustomers.push(c);
                        dl.innerHTML += `<option value="${c.name}">${c.phone || ''}</option>`;
                    });
                }
            });

            // Load Saved Quotations
            const quotesQuery = query(rtdbRef(rtdb, 'quotations'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(quotesQuery, (snap) => {
                if(snap.exists()) {
                    allSavedQuotes = Object.entries(snap.val())
                        .map(([id, val]) => ({ id, ...val }))
                        .reverse();
                } else {
                    allSavedQuotes = [];
                }
                renderSavedQuotesList();

                const params = new URLSearchParams(window.location.search);
                const loadCustomerName = params.get('loadCustomer');
                if (loadCustomerName && !editingQuoteId) {
                    const match = allSavedQuotes.find(q => q.client_name === loadCustomerName);
                    if (match) loadSavedQuotation(match.id);
                    else {
                        document.getElementById('qClientName').value = loadCustomerName;
                        updateStatusBadge(`New for: ${loadCustomerName}`);
                    }
                }
            });
        };

        // Auto-fill phone on customer name match
        document.getElementById('qClientName').addEventListener('input', (e) => {
            const val = e.target.value.trim();
            const found = allCustomers.find(c => c.name.toLowerCase() === val.toLowerCase());
            if(found && found.phone) {
                document.getElementById('qClientPhone').value = found.phone;
            }
        });

        function updateStatusBadge(text) {
            const badge = document.getElementById('currentStatusBadge');
            if(text) { badge.innerText = text; badge.style.display = 'inline-block'; }
            else { badge.style.display = 'none'; }
        }

        // Render Product Picker Grid
        function renderProductGrid(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if(products.length === 0) {
                grid.innerHTML = '<div style="text-align:center; padding: 20px; color:#9ca3af; font-size:12px;">No matching products.</div>';
                return;
            }

            products.forEach(p => {
                const img = p.image || 'https://via.placeholder.com/100?text=Item';
                const isInCart = estimateCart[p.id] !== undefined;
                
                const html = `
                <div class="product-card ${isInCart ? 'in-cart' : ''}" onclick="toggleEstimateItem('${p.id}')">
                    <img src="${img}" class="product-img">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-meta">
                            <span>Cost: ৳${p.buy_price || 0}</span> • <span style="color:var(--primary); font-weight:700;">Rate: ৳${p.sell_price || 0}</span> • <span>Stock: ${p.stock || 0}</span>
                        </div>
                    </div>
                    <div class="cart-toggle-btn">
                        <i class="fas ${isInCart ? 'fa-check' : 'fa-plus'}"></i>
                    </div>
                </div>`;
                grid.insertAdjacentHTML('beforeend', html);
            });
        }

        window.toggleEstimateItem = (id) => {
            if(estimateCart[id]) {
                delete estimateCart[id];
            } else {
                const p = allProducts.find(x => x.id === id);
                estimateCart[id] = { 
                    ...p, 
                    estQty: 1, 
                    estBuy: Number(p.buy_price || 0), 
                    estSell: Number(p.sell_price || 0) 
                };
            }
            
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            applySearch(term);
            renderCart();
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            applySearch(e.target.value.toLowerCase().trim());
        });

        function applySearch(term) {
            if(term === '') {
                renderProductGrid(allProducts.slice(0, 25)); 
            } else {
                const filtered = allProducts.filter(p => 
                    p.name.toLowerCase().includes(term) || 
                    (p.brand && p.brand.toLowerCase().includes(term)) || 
                    (p.barcode && p.barcode.toString().toLowerCase().includes(term))
                );
                renderProductGrid(filtered.slice(0, 25));
            }
        }

        window.updateField = (id, field, value) => {
            estimateCart[id][field] = Number(value) || 0;
            calculateSummary();
        };

            const list = document.getElementById('cartList');

            Object.values(estimateCart).forEach(item => {

                list.innerHTML += `

                        </div>
                        <div class="input-box">
                            <label>Quote Rate (৳)</label>

        window.calculateSummary = () => {
            let totalBuy = 0, subtotalSell = 0;
            Object.values(estimateCart).forEach(item => {
                totalBuy += (item.estBuy * item.estQty);
                subtotalSell += (item.estSell * item.estQty);
            });

            const discount = Number(document.getElementById('discountInput').value) || 0;
            const extra = Number(document.getElementById('extraChargeInput').value) || 0;
            const netSell = (subtotalSell - discount) + extra;
            const profit = netSell - totalBuy;
            const margin = netSell > 0 ? ((profit / netSell) * 100).toFixed(1) : 0;

            document.getElementById('sumBuy').innerText = `৳${totalBuy.toLocaleString()}`;
            document.getElementById('sumSubtotal').innerText = `৳${subtotalSell.toLocaleString()}`;
            document.getElementById('sumSell').innerText = `৳${netSell.toLocaleString()}`;
            
            const profitEl = document.getElementById('sumProfit');
            profitEl.innerText = `৳${profit.toLocaleString()} (${margin}%)`;
            profitEl.style.color = profit >= 0 ? 'var(--success)' : 'var(--danger)';

            return { totalBuy, subtotalSell, discount, extra, netSell, profit, margin };

            const { totalBuy, subtotalSell, discount, extra, netSell, profit, margin } = calculateSummary();

            const itemsToSave = Object.values(estimateCart).map(item => ({
                id: item.id, name: item.name, brand: item.brand || "", 
                estQty: item.estQty, estBuy: item.estBuy, estSell: item.estSell, unit: item.unit || "Pcs"
            }));

            const priceUpdates = {};
            itemsToSave.forEach(it => {
                priceUpdates[`customer_prices/${SHOP_ID}/${safeKey(clientName)}/${it.id}`] = it.estSell;
            });

            const quoteData = {
                shop_id: SHOP_ID,

                client_phone: clientPhone,
                date: qDate,
                valid_until: qValid,

                items: itemsToSave,

                subtotal: subtotalSell,
                discount: discount,
                extra_charge: extra,
                total_sell: netSell,
                profit: profit,
                margin: margin,
                updated_at: Date.now()
            };

            try {

                    await update(rtdbRef(rtdb, `quotations/${editingQuoteId}`), quoteData);
                } else {
                    quoteData.created_at = Date.now();

                    editingQuoteId = newRef.key;
                }

                // Sync with customer quick profile & customer special prices
                await update(rtdbRef(rtdb), {

            document.getElementById('qClientPhone').value = '';
            document.getElementById('qNotes').value = '';
            document.getElementById('discountInput').value = '0';
            document.getElementById('extraChargeInput').value = '0';
            updateStatusBadge('');
            applySearch('');
            renderCart();
        };

        // --- CONVERT TO SALE ---
        window.convertToSale = async () => {
            if(Object.keys(estimateCart).length === 0) return alert("Cart is empty! Add items first.");
            let clientName = document.getElementById('qClientName').value.trim();
            if(!clientName) {
                clientName = prompt("কাস্টমারের নাম লিখুন:");
                if(!clientName || !clientName.trim()) return;
                clientName = clientName.trim();
                document.getElementById('qClientName').value = clientName;
            }

            await window.saveQuotation();
            window.location.href = `sell.html?prefillCustomer=${encodeURIComponent(clientName)}`;
        };

        // --- BARCODE SCANNER ---
        window.startScanner = () => {
            document.getElementById('scannerModal').style.display = 'flex';
            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 280, height: 140 }, disableFlip: false };
            
            html5QrcodeScanner.start({ facingMode: "environment" }, config, (decodedText) => {
                window.stopScanner();
                const audio = new Audio('https://www.soundjay.com/button/beep-07.wav'); audio.play().catch(e=>{});
                document.getElementById('searchInput').value = decodedText;
                document.getElementById('searchInput').dispatchEvent(new Event('input'));
            }).catch(err => { alert("Camera error: " + err); window.stopScanner(); });
        };
        
        window.stopScanner = () => {
            if(html5QrcodeScanner) { html5QrcodeScanner.stop().then(() => { document.getElementById('scannerModal').style.display = 'none'; }); } 
            else { document.getElementById('scannerModal').style.display = 'none'; }
        };
    </script>
</body>
</html>
