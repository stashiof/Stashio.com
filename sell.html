<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Point of Sale (Sell) - Stashio</title>
    
    <meta name="theme-color" content="#4F46E5">

    <script>
        const loggedInUser = localStorage.getItem('tempUserPhone') || sessionStorage.getItem('tempUserPhone') || localStorage.getItem('userPhone');
        const activeShopId = localStorage.getItem('activeShopId');
        if (!loggedInUser) window.location.replace("index.html");
        else if (!activeShopId) window.location.replace("dashboard.html");
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --primary: #4F46E5; --secondary: #ec4899; --bg-color: #f3f4f6; --white: #ffffff; --text-dark: #1f2937; --text-light: #6b7280; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; --border-radius: 20px; --shadow: 0 10px 25px rgba(0,0,0,0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-dark); overflow-x: hidden; }
        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .view-container { display: none; flex-direction: column; min-height: 100vh; background: var(--bg-color); animation: fadeIn 0.3s ease-out; }
        .view-container.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .app-header { background: linear-gradient(135deg, var(--primary) 0%, #764ba2 100%); padding: 20px 20px 30px 20px; color: white; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2); }
        .header-title { display: flex; align-items: center; gap: 15px; font-size: 18px; font-weight: 700; }
        .header-title a { color: white; text-decoration: none; }
        .search-container { margin: -15px 15px 15px 15px; display: flex; gap: 10px; position: relative; z-index: 60; }
        .search-box { flex: 1; position: relative; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .search-box input { width: 100%; padding: 14px 15px 14px 40px; border-radius: 16px; border: none; outline: none; box-shadow: var(--shadow); font-size: 14px; font-family: 'Poppins', sans-serif; }
        .btn-scan { background: var(--text-dark); color: white; width: 50px; border-radius: 16px; border: none; box-shadow: var(--shadow); cursor: pointer; font-size: 20px; transition: 0.2s; }
        .btn-scan:active { transform: scale(0.95); }
        .product-list { padding: 0 15px 100px 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .product-card { background: var(--white); border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); border: 2px solid transparent; transition: 0.2s; cursor: pointer; }
        .product-card.in-cart { border-color: var(--primary); background: #f0f5ff; }
        .product-img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; background: #f8fafc; border: 1px solid #f1f5f9; }
        .product-info { flex: 1; }
        .product-name { font-size: 14px; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .product-brand { font-size: 10px; color: var(--primary); font-weight: 600; display: block; margin-bottom: 4px; }
        .product-meta { display: flex; gap: 10px; font-size: 11px; }
        .badge-stock { background: #f1f5f9; padding: 2px 8px; border-radius: 8px; color: var(--text-light); font-weight: 600; }
        .badge-price { background: #e0e7ff; padding: 2px 8px; border-radius: 8px; color: var(--primary); font-weight: 700; }
        .cart-toggle-btn { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: #9ca3af; font-size: 14px; transition: 0.2s; }
        .product-card.in-cart .cart-toggle-btn { background: var(--primary); color: white; }
        .load-more-btn { background: white; border: 1px solid #e5e7eb; color: var(--primary); font-weight: bold; padding: 10px; border-radius: 10px; text-align: center; margin: 10px 0; cursor: pointer; display: none; box-shadow: var(--shadow); }
        .bottom-checkout-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -5px 20px rgba(0,0,0,0.08); border-top-left-radius: 25px; border-top-right-radius: 25px; z-index: 100; }
        .cart-summary p { margin: 0; font-size: 12px; color: var(--text-light); font-weight: 600; }
        .cart-summary h3 { margin: 0; font-size: 18px; font-weight: 700; color: var(--primary); }
        .btn-proceed { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 12px 25px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 15px rgba(236, 72, 153, 0.3); transition: 0.2s; }
        .btn-proceed:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }
        .checkout-content { padding: 20px 15px 120px 15px; overflow-y: auto; flex: 1; }
        .form-card { background: var(--white); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid #f8fafc; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-light); margin-bottom: 5px; text-transform: uppercase; }
        .input-field { width: 100%; padding: 12px 15px; border: 2px solid #f1f5f9; border-radius: 12px; background: #f8fafc; outline: none; font-size: 13px; font-family: 'Poppins', sans-serif; transition: 0.3s; color: var(--text-dark); }
        .input-field:focus { border-color: var(--primary); background: white; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .custom-dropdown-container { position: relative; }
        .custom-dropdown-list { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto; z-index: 1000; display: none; margin-top: 5px; }
        .dropdown-item-cust { padding: 12px 15px; border-bottom: 1px solid #f3f4f6; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-dark); transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .dropdown-item-cust:hover { background: #f0f5ff; color: var(--primary); }
        .dropdown-item-cust .cust-phone { font-size: 10px; color: var(--text-light); font-weight: 500; }
        .cart-item-checkout { padding: 15px 0; border-bottom: 1px dashed #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .item-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .qty-btn { width: 28px; height: 28px; border-radius: 8px; border: none; background: #f1f5f9; color: var(--text-dark); font-weight: bold; cursor: pointer; }
        .qty-input { width: 40px; text-align: center; border: 1px solid #e5e7eb; border-radius: 8px; padding: 4px; font-size: 13px; font-weight: bold; }
        .rate-input { width: 70px; text-align: right; border: 1px solid #e5e7eb; border-radius: 8px; padding: 4px 8px; font-size: 13px; font-weight: bold; color: var(--primary); }
        .total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 15px; color: var(--text-dark); }
        .payment-methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .pay-method-label input { display: none; }
        .pay-method-box { border: 2px solid #e5e7eb; border-radius: 12px; padding: 10px 5px; text-align: center; font-size: 11px; font-weight: 700; color: var(--text-light); transition: 0.2s; cursor: pointer; }
        .pay-method-label input:checked + .pay-method-box { border-color: var(--primary); background: #f0f5ff; color: var(--primary); }
        .btn-confirm { width: 100%; background: var(--success); color: white; border: none; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3); transition: 0.2s; }
        .btn-confirm:active { transform: scale(0.98); }
        #scannerModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #reader { width: 100%; max-width: 350px; border-radius: 20px; overflow: hidden; border: 3px solid var(--primary); }
        .btn-close-scanner { margin-top: 30px; background: white; color: var(--danger); border: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        #priceToast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #f59e0b; color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; display: none; z-index: 1000; box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3); animation: slideDown 0.3s; }
        @keyframes slideDown { from { top: 50px; opacity: 0; } to { top: 80px; opacity: 1; } }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="priceToast"><i class="fas fa-magic"></i> Special customer price applied!</div>

    <div id="view-selection" class="view-container active">
        <div class="app-header">
            <div class="header-title"><a href="home.html"><i class="fas fa-arrow-left"></i></a><span>Point of Sale (Sell)</span></div>
        </div>
        <div class="search-container">
            <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search by name, brand or barcode..."></div>
            <button onclick="startScanner()" class="btn-scan"><i class="fas fa-barcode"></i></button>
        </div>
        <div id="loading" style="text-align: center; padding: 40px; color: var(--text-light); font-weight: 600; font-size: 13px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 24px; color: var(--primary); margin-bottom: 10px;"></i><br>Loading Inventory...
        </div>
        <div class="product-list">
            <div id="productGrid"></div>
            <div id="loadMoreBtn" class="load-more-btn" onclick="loadMoreProducts()">Load More Products</div>
        </div>
        <div class="bottom-checkout-bar">
            <div class="cart-summary"><p>Items in Cart</p><h3><span id="cartCount">0</span> Items</h3></div>
            <button onclick="goToCheckout()" class="btn-proceed" id="btnToCheckout" disabled>Proceed <i class="fas fa-arrow-right" style="margin-left: 5px;"></i></button>
        </div>
    </div>

    <div id="view-checkout" class="view-container">
        <div class="app-header" style="padding-bottom: 25px;">
            <div class="header-title"><button onclick="showView('view-selection')" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;"><i class="fas fa-arrow-left"></i></button><span>Checkout Details</span></div>
        </div>
        <div class="checkout-content">
            <div class="form-card">
                <div class="grid-2">
                    <div class="input-group"><label>Invoice No</label><input type="text" id="invoiceNo" class="input-field" style="font-family: monospace; font-weight: bold;" placeholder="Auto (on confirm)" readonly></div>
                    <div class="input-group"><label>Date (Auto sets properly)</label><input type="date" id="sellDate" class="input-field"></div>
                </div>
                <div class="input-group custom-dropdown-container">
                    <label>Customer Name</label><input type="text" id="customerName" class="input-field" placeholder="Search or select customer..." autocomplete="off">
                    <div id="customerDropdown" class="custom-dropdown-list"></div>
                </div>
            </div>
            <div class="form-card" style="padding: 0;">
                <div style="background: #f0f5ff; padding: 12px 20px; border-top-left-radius: 20px; border-top-right-radius: 20px; font-size: 11px; font-weight: 700; color: var(--primary); display: flex; justify-content: space-between;"><span>ITEM & QTY</span><span>RATE & TOTAL</span></div>
                <div id="cartItemsList" style="padding: 0 20px;"></div>
            </div>
            <div class="form-card">
                <div class="total-row"><span>Grand Total:</span><span style="color: var(--primary);" id="grandTotalDisplay">৳0.00</span></div>
                <div class="input-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                    <label style="margin: 0; width: 100px;">Discount (৳):</label>
                    <input type="number" id="discountInput" oninput="calculateSummary()" value="0" class="input-field" style="padding: 8px 12px;">
                </div>
                <div class="grid-2">
                    <div class="input-group">
                        <label>Received / Advance (৳)</label>
                        <input type="number" id="paidInput" class="input-field" readonly value="0" style="font-size: 16px; font-weight: bold; border-color: var(--primary); color: var(--primary); background:#f8fafc;">
                    </div>
                    <div style="text-align: right;">
                        <label style="font-size: 11px; font-weight: 700; color: var(--text-light); text-transform: uppercase;" id="dueOrReturnLabel">Due Amount</label>
                        <div style="font-size: 20px; font-weight: 700; color: var(--danger); margin-top: 5px;" id="dueDisplay">৳0.00</div>
                    </div>
                </div>
                <div style="margin-top: 10px;">
                    <label style="font-size: 11px; font-weight: 700; color: var(--text-light); text-transform: uppercase;">Payment Breakdown (একাধিক মাধ্যমে টাকা পেলে প্রতিটায় আলাদা লিখুন)</label>
                    <div class="grid-3" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; margin-top:6px;">
                        <div class="input-group" style="margin-bottom:0;">
                            <label style="font-size:10px;"><i class="fas fa-money-bill-wave" style="color:#16a34a;"></i> Cash</label>
                            <input type="number" id="payCash" class="input-field" oninput="calculateSummary()" placeholder="0" style="padding:8px; font-size:13px;">
                        </div>
                        <div class="input-group" style="margin-bottom:0;">
                            <label style="font-size:10px;"><i class="fas fa-mobile-alt" style="color:#e11d48;"></i> Bkash/Nagad</label>
                            <input type="number" id="payMFS" class="input-field" oninput="calculateSummary()" placeholder="0" style="padding:8px; font-size:13px;">
                        </div>
                        <div class="input-group" style="margin-bottom:0;">
                            <label style="font-size:10px;"><i class="fas fa-university" style="color:#2563eb;"></i> Bank</label>
                            <input type="number" id="payBank" class="input-field" oninput="calculateSummary()" placeholder="0" style="padding:8px; font-size:13px;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="bottom-checkout-bar" style="padding: 15px; display: flex; gap: 10px;">
            <button id="saveOrderBtn" onclick="saveAsOrder()" class="btn-confirm" style="background: var(--warning); flex: 1; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3); font-size: 13px;">Save Order <i class="fas fa-clipboard-list" style="margin-left: 5px;"></i></button>
            <button id="confirmBtn" onclick="confirmSell()" class="btn-confirm" style="flex: 1.5; font-size: 13px;">Confirm Sale <i class="fas fa-check-circle" style="margin-left: 5px;"></i></button>
        </div>
    </div>

    <div id="view-receipt" class="view-container" style="background: #f1f5f9;">
        <div style="padding: 15px; flex: 1; overflow-y: auto;">
            <div id="receiptRenderTarget"></div>
        </div>
        <div class="no-print" style="padding: 20px; display: flex; gap: 12px;">
            <button onclick="window.printLastSale()" style="flex: 1; padding: 15px; background: var(--text-dark); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer;"><i class="fas fa-print"></i> Print</button>
            <button onclick="window.downloadLastSalePdf()" style="flex: 1; padding: 15px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer;"><i class="fas fa-file-pdf"></i> PDF</button>
            <button onclick="location.reload()" style="flex: 1; padding: 15px; background: var(--success); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer;">New Sale</button>
        </div>
    </div>

    <div id="printableInvoiceHolder" style="display:none;"></div>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printableInvoiceHolder, #printableInvoiceHolder * { visibility: visible; }
            #printableInvoiceHolder { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>

    <div id="scannerModal"><div id="reader"></div><button onclick="stopScanner()" class="btn-close-scanner">Close Camera</button></div>

    <script type="module">
        import { rtdb, ref as rtdbRef, push, update, onValue as rtdbOnValue, get } from './firebase_config.js';
        import { runTransaction, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        import { getShopBranding, renderPremiumDocument, showPdfPreview } from './invoice_kit.js';

        // Firebase RTDB key-তে '.', '#', '$', '[', ']', '/' অক্ষর নিষিদ্ধ — কাস্টমারের
        // নামে এসব থাকলে (যেমন "M/S ABC Traders.") raw নাম দিয়ে path বানালে write silently
        // fail করে। তাই customer-নাম-ভিত্তিক সব path-এ এই sanitize করা key ব্যবহার হয়।
        function sanitizeKey(name) { return name.trim().replace(/[.#$\[\]\/]/g, '_'); }

        const SHOP_ID = localStorage.getItem('activeShopId'); 
        let allProducts = [], displayedProducts = [], itemsPerPage = 20, currentPage = 1;
        let allCustomers = [], cart = {}, html5QrcodeScanner = null, currentCustomerPrices = {}; 

        window.onload = () => {
            document.getElementById('sellDate').valueAsDate = new Date();

            const cachedProducts = localStorage.getItem(`products_${SHOP_ID}`);
            if(cachedProducts) { allProducts = JSON.parse(cachedProducts); initPagination(allProducts); }

            const productsQuery = query(rtdbRef(rtdb, 'product_list'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(productsQuery, (snap) => {
                const loader = document.getElementById('loading');
                if(loader) loader.style.display = 'none';
                if (snap.exists()) {
                    allProducts = Object.entries(snap.val()).map(([id, val]) => ({ id, ...val })).filter(p => !p.is_deleted);
                    localStorage.setItem(`products_${SHOP_ID}`, JSON.stringify(allProducts));
                    if(document.getElementById('searchInput').value.trim() === '') initPagination(allProducts);
                } else {
                    allProducts = []; localStorage.removeItem(`products_${SHOP_ID}`);
                    document.getElementById('productGrid').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-light); font-weight:600;">No products available to sell.</div>';
                }
            });

            const customersQuery = query(rtdbRef(rtdb, 'contacts/customers'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(customersQuery, (snap) => {
                allCustomers = [{ name: 'Local (Walk-in)', phone: '' }]; 
                if(snap.exists()){ Object.values(snap.val()).forEach(c => allCustomers.push(c)); }
            });

            // estimate.html-এর "Convert to Sale" থেকে আসলে কাস্টমার নাম অটো-ফিল করা হয়,
            // যাতে সেই কাস্টমারের quotation-এর দাম triggerSpecialPriceFetch দিয়ে অটো বসে যায়।
            const params = new URLSearchParams(window.location.search);
            const prefillCustomer = params.get('prefillCustomer');
            if (prefillCustomer) {
                custInput.value = prefillCustomer;
                triggerSpecialPriceFetch(prefillCustomer);
            }
        };

        // Date Parser for History
        function getActionTimestamp() {
            const dateInput = document.getElementById('sellDate').value;
            const actionDate = new Date(dateInput);
            const now = new Date();
            actionDate.setHours(now.getHours(), now.getMinutes(), now.getSeconds());
            return actionDate.getTime();
        }

        function initPagination(products) {
            currentPage = 1; displayedProducts = products;
            document.getElementById('productGrid').innerHTML = '';
            if(displayedProducts.length === 0) {
                document.getElementById('productGrid').innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-light);">No products found.</div>';
                document.getElementById('loadMoreBtn').style.display = 'none'; return;
            }
            renderProductGrid(displayedProducts.slice(0, itemsPerPage));
            document.getElementById('loadMoreBtn').style.display = displayedProducts.length > itemsPerPage ? 'block' : 'none';
        }

        window.loadMoreProducts = () => {
            const startIndex = currentPage * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            renderProductGrid(displayedProducts.slice(startIndex, endIndex), true); 
            currentPage++;
            if(endIndex >= displayedProducts.length) document.getElementById('loadMoreBtn').style.display = 'none';
        };

        const custInput = document.getElementById('customerName');
        const custDropdown = document.getElementById('customerDropdown');

        function renderCustomerDropdown(filterText = '') {
            custDropdown.innerHTML = '';
            const filtered = allCustomers.filter(c => c.name.toLowerCase().includes(filterText.toLowerCase()) || (c.phone && c.phone.includes(filterText)));
            if(filtered.length === 0) {
                custDropdown.innerHTML = '<div style="padding:10px; text-align:center; color:#9ca3af; font-size:12px;">No customers found</div>';
            } else {
                filtered.forEach(c => {
                    const div = document.createElement('div'); div.className = 'dropdown-item-cust';
                    div.innerHTML = `<span>${c.name}</span> <span class="cust-phone">${c.phone || ''}</span>`;
                    div.onclick = () => { custInput.value = c.name; custDropdown.style.display = 'none'; triggerSpecialPriceFetch(c.name); };
                    custDropdown.appendChild(div);
                });
            }
            custDropdown.style.display = 'block';
        }

        custInput.addEventListener('focus', () => renderCustomerDropdown(custInput.value));
        custInput.addEventListener('input', (e) => { renderCustomerDropdown(e.target.value); triggerSpecialPriceFetch(e.target.value); });
        document.addEventListener('click', (e) => { if(!custInput.contains(e.target) && !custDropdown.contains(e.target)) custDropdown.style.display = 'none'; });

        async function triggerSpecialPriceFetch(custName) {
            custName = custName.trim();
            if(!custName || custName === "Local (Walk-in)") { currentCustomerPrices = {}; return; }
            try {
                const snap = await get(rtdbRef(rtdb, `customer_prices/${SHOP_ID}/${sanitizeKey(custName)}`));
                if(snap.exists()) {
                    currentCustomerPrices = snap.val(); let updated = false;
                    Object.keys(cart).forEach(id => { if(currentCustomerPrices[id]) { cart[id].sellRate = currentCustomerPrices[id]; updated = true; } });
                    if(updated) {
                        if(document.getElementById('view-checkout').classList.contains('active')) { renderCartItems(); calculateSummary(); }
                        const toast = document.getElementById('priceToast'); toast.style.display = 'block'; setTimeout(() => toast.style.display = 'none', 3000);
                    }
                } else { currentCustomerPrices = {}; }
            } catch(err) { console.log("Pricing fetch error: ", err); }
        }

        function renderProductGrid(products, append = false) {
            const grid = document.getElementById('productGrid');
            if(!append) grid.innerHTML = '';
            products.forEach(p => {
                const img = p.image || 'https://via.placeholder.com/100?text=Item';
                const isInCart = cart[p.id] !== undefined; const outOfStock = p.stock <= 0;
                const html = `
                <div class="product-card ${isInCart ? 'in-cart' : ''}" style="${outOfStock ? 'opacity: 0.5; pointer-events: none;' : ''}" onclick="toggleCart('${p.id}')">
                    <img src="${img}" class="product-img">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        ${p.brand ? `<span class="product-brand"><i class="fas fa-tag"></i> ${p.brand}</span>` : ''}
                        <div class="product-meta">
                            <span class="badge-stock" style="color: ${outOfStock ? 'red' : 'inherit'}">Stock: ${p.stock || 0}</span>
                            <span class="badge-price">Sell: ৳${p.sell_price || 0}</span>
                        </div>
                    </div>
                    <div class="cart-toggle-btn"><i class="fas ${isInCart ? 'fa-check' : 'fa-plus'}"></i></div>
                </div>`;
                grid.insertAdjacentHTML('beforeend', html);
            });
            updateCartCount();
        }

        window.toggleCart = (id) => {
            if(cart[id]) { delete cart[id]; } 
            else {
                const product = allProducts.find(p => p.id === id);
                if(product && product.stock > 0) {
                    let appliedRate = product.sell_price || 0;
                    if(currentCustomerPrices[product.id]) appliedRate = currentCustomerPrices[product.id];
                    cart[id] = { ...product, qty: 1, sellRate: appliedRate };
                }
            }
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            if(searchTerm) {
                const filtered = allProducts.filter(p => p.name.toLowerCase().includes(searchTerm) || (p.brand && p.brand.toLowerCase().includes(searchTerm)) || (p.barcode && p.barcode.toString().toLowerCase().includes(searchTerm)));
                initPagination(filtered);
            } else { initPagination(allProducts); }
        };

        function updateCartCount() {
            const count = Object.keys(cart).length;
            document.getElementById('cartCount').innerText = count;
            document.getElementById('btnToCheckout').disabled = count === 0;
        }

        window.goToCheckout = () => { renderCartItems(); calculateSummary(true); showView('view-checkout'); };

        function renderCartItems() {
            const list = document.getElementById('cartItemsList'); list.innerHTML = '';
            Object.values(cart).forEach((item) => {
                const lineTotal = item.qty * item.sellRate;
                const isSpecial = currentCustomerPrices[item.id] !== undefined;
                const html = `
                <div class="cart-item-checkout">
                    <div style="flex: 1;">
                        <div style="font-size: 13px; font-weight: 700; color: var(--text-dark);">${item.name} ${isSpecial ? '<i class="fas fa-star text-warning" style="font-size:10px;"></i>' : ''}</div>
                        <div class="item-controls">
                            <button onclick="updateCartQty('${item.id}', -1)" class="qty-btn"><i class="fas fa-minus"></i></button>
                            <input type="number" value="${item.qty}" onchange="updateCartQty('${item.id}', 0, this.value)" class="qty-input">
                            <button onclick="updateCartQty('${item.id}', 1)" class="qty-btn"><i class="fas fa-plus"></i></button>
                            <span style="font-size: 11px; color: var(--text-light);">${item.unit || 'pcs'}</span>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-bottom: 5px;">
                            <span style="font-size: 11px; color: var(--text-light);">Rate:</span>
                            <input type="number" value="${item.sellRate}" onchange="updateCartRate('${item.id}', this.value)" class="rate-input">
                        </div>
                        <div style="font-size: 16px; font-weight: 800; color: var(--text-dark);">৳${lineTotal}</div>
                        <button onclick="removeCartItem('${item.id}')" style="background:none; border:none; color: var(--danger); font-size: 11px; font-weight:600; cursor:pointer; margin-top:5px;"><i class="fas fa-trash"></i> Remove</button>
                    </div>
                </div>`;
                list.insertAdjacentHTML('beforeend', html);
            });
            if(Object.keys(cart).length === 0) showView('view-selection'); 
        }

        window.updateCartQty = (id, change, manualValue = null) => {
            let newQty = manualValue ? Number(manualValue) : cart[id].qty + change;
            const maxStock = cart[id].stock;
            if(newQty > maxStock) { alert(`Maximum available stock: ${maxStock}`); newQty = maxStock; }
            if(newQty <= 0) { if(confirm("Remove this item?")) delete cart[id]; } else { cart[id].qty = newQty; }
            renderCartItems(); calculateSummary(); updateCartCount();
        };

        window.updateCartRate = (id, value) => { cart[id].sellRate = Number(value) || 0; renderCartItems(); calculateSummary(); };
        window.removeCartItem = (id) => { delete cart[id]; renderCartItems(); calculateSummary(); updateCartCount(); }

        window.calculateSummary = (autoFill = false) => {
            let subtotal = 0; Object.values(cart).forEach(item => { subtotal += item.qty * item.sellRate; });
            const discount = Number(document.getElementById('discountInput').value) || 0;
            const grandTotal = subtotal - discount;
            document.getElementById('grandTotalDisplay').innerText = `৳${grandTotal}`;

            const cashEl = document.getElementById('payCash');
            const mfsEl = document.getElementById('payMFS');
            const bankEl = document.getElementById('payBank');

            // নতুন কার্ট/আইটেম যোগের সময় (autoFill) ডিফল্টভাবে পুরো টাকাটা Cash-এ বসিয়ে দেওয়া হয়,
            // যাতে সাধারণ single-payment বিক্রির জন্য আলাদা করে কিছু টাইপ করতে না হয়।
            // ইউজার চাইলে এই মান বদলে একাধিক মাধ্যমে ভাগ করে দিতে পারবে (split payment)।
            if (autoFill && cashEl.value === '' && mfsEl.value === '' && bankEl.value === '') {
                cashEl.value = grandTotal;
            }

            const cash = Number(cashEl.value) || 0;
            const mfs = Number(mfsEl.value) || 0;
            const bank = Number(bankEl.value) || 0;
            const paid = cash + mfs + bank;

            document.getElementById('paidInput').value = paid;
            const due = grandTotal - paid;
            
            if(due < 0) {
                document.getElementById('dueOrReturnLabel').innerText = "Return Change";
                document.getElementById('dueDisplay').innerText = `৳${Math.abs(due)}`;
                document.getElementById('dueDisplay').style.color = "var(--success)";
            } else {
                document.getElementById('dueOrReturnLabel').innerText = "Due Amount";
                document.getElementById('dueDisplay').innerText = `৳${due}`;
                document.getElementById('dueDisplay').style.color = "var(--danger)";
            }

            // পেমেন্ট breakdown সেভ করার জন্য — একাধিক মাধ্যমে টাকা এলে সবগুলো রেকর্ডে থাকবে
            const paymentBreakdown = {};
            if (cash > 0) paymentBreakdown.Cash = cash;
            if (mfs > 0) paymentBreakdown.MFS = mfs;
            if (bank > 0) paymentBreakdown.Bank = bank;
            // চালান/রিসিটে দেখানোর জন্য একটা সংক্ষিপ্ত লেবেল (যেমন "Cash + Bank")
            const methodLabel = Object.keys(paymentBreakdown).join(' + ') || 'Cash';

            window.checkoutSummary = { subtotal, discount, grandTotal, paid, due: due > 0 ? due : 0, paymentBreakdown, methodLabel };
        };

        // ============================================
        // --- SAVE AS ORDER (Calculates Estimated Profit) ---
        // ============================================
        window.saveAsOrder = async () => {
            if(Object.keys(cart).length === 0) return alert("Cart is empty!");
            const btn = document.getElementById('saveOrderBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; btn.disabled = true;

            const customerName = document.getElementById('customerName').value || "Local (Walk-in)";
            const { subtotal, discount, grandTotal, paid, due, paymentBreakdown } = window.checkoutSummary;
            const finalTimestamp = getActionTimestamp(); // BACKDATED TIME
            
            let estimatedProfit = 0;
            const itemsToSave = [];
            
            Object.values(cart).forEach(item => {
                const buyRate = Number(item.buy_price || 0);
                const itemProfit = (item.sellRate - buyRate) * item.qty;
                estimatedProfit += itemProfit;

                itemsToSave.push({ 
                    id: item.id, name: item.name, brand: item.brand || '', 
                    qty: item.qty, sellRate: item.sellRate, buy_price: buyRate 
                });
            });

            estimatedProfit = estimatedProfit - discount; // Deduct discount from profit

            try {
                // Atomically generate a sequential order number so two orders saved
                // at the same moment never collide.
                const counterResult = await runTransaction(rtdbRef(rtdb, `counters/${SHOP_ID}/order_no`), (current) => (current || 0) + 1);
                const orderNo = "ORD-" + String(counterResult.snapshot.val()).padStart(6, '0');

                const orderData = {
                    shop_id: SHOP_ID, order_no: orderNo, customer: customerName,
                    date: document.getElementById('sellDate').value,
                    items: itemsToSave, subtotal: subtotal, discount: discount, total_amount: grandTotal,
                    advance_paid: paid, estimated_profit: estimatedProfit,
                    status: 'Pending', created_at: finalTimestamp
                };

                await push(rtdbRef(rtdb, 'sales_orders'), orderData);
                // শুধু Cash অংশটাই দোকানের ফিজিক্যাল ক্যাশবক্সে যোগ হয় — MFS/Bank-এ পাওয়া
                // টাকা দোকানদারের হাতে নগদ আসে না, তাই cash_settings-এ যোগ করা হয় না।
                const cashPortion = (paymentBreakdown && paymentBreakdown.Cash) || 0;
                if(cashPortion > 0) {
                    await runTransaction(rtdbRef(rtdb, `cash_settings/${SHOP_ID}/current_balance`), (bal) => (bal || 0) + cashPortion);
                    await push(rtdbRef(rtdb, 'cash_transactions'), {
                        shop_id: SHOP_ID, type: 'cash_in', source: 'order_advance',
                        amount: cashPortion, note: `Advance (Cash) for Order: ${orderNo}`, created_at: finalTimestamp
                    });
                }
                alert("Order saved successfully!"); location.reload(); 
            } catch (err) {
                alert("Error saving order: " + err.message);
                btn.innerHTML = 'Save Order <i class="fas fa-clipboard-list" style="margin-left: 5px;"></i>'; btn.disabled = false;
            }
        };

        // ============================================
        // --- NORMAL SELL (Direct confirm) ---
        // ============================================
        window.confirmSell = async () => {
            if(Object.keys(cart).length === 0) return alert("Cart is empty!");
            const btn = document.getElementById('confirmBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...'; btn.disabled = true;

            const customerName = document.getElementById('customerName').value || "Local (Walk-in)";
            const { subtotal, discount, grandTotal, paid, due, paymentBreakdown, methodLabel } = window.checkoutSummary;
            const finalTimestamp = getActionTimestamp(); // BACKDATED TIME
            
            let totalProfit = 0; const itemsToSave = [];

            Object.values(cart).forEach(item => {
                const itemProfit = (item.sellRate - item.buy_price) * item.qty; totalProfit += itemProfit;
                itemsToSave.push({ id: item.id, name: item.name, brand: item.brand || '', qty: item.qty, sellRate: item.sellRate, buyRate: item.buy_price, profit: itemProfit });
            });
            totalProfit = totalProfit - discount;

            const decrementedItems = []; // track successful decrements for rollback on failure
            try {
                // Atomically generate a sequential invoice number so two sales confirmed
                // at the same moment never collide (unlike the old random INV-XXXXXX).
                const counterResult = await runTransaction(rtdbRef(rtdb, `counters/${SHOP_ID}/invoice_no`), (current) => (current || 0) + 1);
                const invoiceNo = "INV-" + String(counterResult.snapshot.val()).padStart(6, '0');
                document.getElementById('invoiceNo').value = invoiceNo;

                const sellData = {
                    shop_id: SHOP_ID, invoice_no: invoiceNo, customer: customerName,
                    date: document.getElementById('sellDate').value,
                    items: itemsToSave, subtotal: subtotal, discount: discount, total_amount: grandTotal,
                    paid_amount: paid, due_amount: due, total_profit: totalProfit,
                    payment_method: methodLabel || 'Cash',
                    payment_breakdown: paymentBreakdown || {},
                    created_at: finalTimestamp
                };

                // Atomically decrement stock per item so concurrent sales never overwrite
                // each other's stock changes (prevents over-selling / negative stock).
                for (const item of Object.values(cart)) {
                    const stockResult = await runTransaction(rtdbRef(rtdb, `product_list/${item.id}/stock`), (currentStock) => {
                        const stock = currentStock || 0;
                        if (stock < item.qty) return; // abort: not enough stock anymore
                        return stock - item.qty;
                    });
                    if (!stockResult.committed) {
                        // Roll back any items already decremented in this sale before failing
                        for (const done of decrementedItems) {
                            await runTransaction(rtdbRef(rtdb, `product_list/${done.id}/stock`), (s) => (s || 0) + done.qty);
                        }
                        throw new Error(`"${item.name}" এর স্টক পর্যাপ্ত নেই (আরেকজন হয়তো একই সময়ে বিক্রি করেছে)। আবার চেষ্টা করুন।`);
                    }
                    decrementedItems.push({ id: item.id, qty: item.qty });
                }

                await push(rtdbRef(rtdb, 'sales_history'), sellData);
                const updates = {};
                Object.values(cart).forEach(item => {
                    if(customerName !== "Local (Walk-in)" && customerName.trim() !== "") updates[`customer_prices/${SHOP_ID}/${sanitizeKey(customerName)}/${item.id}`] = item.sellRate;
                });
                if (Object.keys(updates).length > 0) await update(rtdbRef(rtdb), updates);

                if(paid > 0) {
                    const cashPortion = (paymentBreakdown && paymentBreakdown.Cash) || 0;
                    if(cashPortion > 0) {
                        await runTransaction(rtdbRef(rtdb, `cash_settings/${SHOP_ID}/current_balance`), (bal) => (bal || 0) + cashPortion);
                        await push(rtdbRef(rtdb, 'cash_transactions'), {
                            shop_id: SHOP_ID, type: 'cash_in', source: 'sell',
                            amount: cashPortion, note: `Sale (Cash): ${invoiceNo}`, created_at: finalTimestamp
                        });
                    }
                }
                if(due > 0 && customerName !== "Local (Walk-in)") {
                    const dueRef = await push(rtdbRef(rtdb, 'due_book'), { shop_id: SHOP_ID, type: 'receive', name: customerName, total_amount: due, current_due: due, created_at: finalTimestamp });
                    await push(rtdbRef(rtdb, 'due_history'), { due_id: dueRef.key, name: customerName, type: 'receive', action: 'Created (Invoice: ' + invoiceNo + ')', amount: due, date: finalTimestamp });
                }

                await generateReceipt(sellData); showView('view-receipt');
            } catch (err) { alert("Error: " + err.message); btn.innerHTML = 'Confirm Sale <i class="fas fa-check-circle" style="margin-left: 5px;"></i>'; btn.disabled = false; }
        };

        let lastSaleData = null; // পরে Print/PDF বাটনে ব্যবহারের জন্য

        async function generateReceipt(data) {
            lastSaleData = data;
            const shop = await getShopBranding(SHOP_ID);

            const items = data.items.map(item => ({
                name: item.name, brand: item.brand, unit: 'pcs',
                qty: item.qty, rate: item.sellRate, amount: item.qty * item.sellRate
            }));

            const html = renderPremiumDocument({
                docType: 'INVOICE',
                docNo: data.invoice_no,
                docDate: data.date,
                shop: shop,
                partyLabel: 'Bill To',
                partyName: data.customer,
                items: items,
                subtotal: data.subtotal,
                discount: data.discount,
                total: data.total_amount,
                paid: data.paid_amount,
                due: data.due_amount,
                extraNote: `Payment Method: ${data.payment_method}`,
                footerNote: 'Thank you for shopping with us!'
            });

            document.getElementById('receiptRenderTarget').innerHTML = html;
            document.getElementById('printableInvoiceHolder').innerHTML = html;
        }

        window.printLastSale = () => { window.print(); };

        window.downloadLastSalePdf = () => {
            if (!lastSaleData) return;
            const el = document.getElementById('printableInvoiceHolder');
            showPdfPreview(el.innerHTML, `Invoice_${lastSaleData.invoice_no}.pdf`);
        };

        window.showView = (id) => { ['view-selection', 'view-checkout', 'view-receipt'].forEach(v => document.getElementById(v).classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0, 0); };
        document.getElementById('searchInput').addEventListener('input', (e) => { const term = e.target.value.toLowerCase().trim(); if(term === '') { initPagination(allProducts); } else { const filtered = allProducts.filter(p => p.name.toLowerCase().includes(term) || (p.brand && p.brand.toLowerCase().includes(term)) || (p.barcode && p.barcode.toString().toLowerCase().includes(term))); initPagination(filtered); } });

        window.startScanner = () => { document.getElementById('scannerModal').style.display = 'flex'; html5QrcodeScanner = new Html5Qrcode("reader"); const config = { fps: 15, qrbox: { width: 300, height: 150 }, disableFlip: false }; html5QrcodeScanner.start({ facingMode: "environment" }, config, (decodedText) => { window.stopScanner(); const audio = new Audio('https://www.soundjay.com/button/beep-07.wav'); audio.play().catch(e=>{}); document.getElementById('searchInput').value = decodedText; document.getElementById('searchInput').dispatchEvent(new Event('input')); }).catch(err => { alert("Camera access denied or error"); window.stopScanner(); }); };
        window.stopScanner = () => { if(html5QrcodeScanner) { html5QrcodeScanner.stop().then(() => { document.getElementById('scannerModal').style.display = 'none'; }); } else { document.getElementById('scannerModal').style.display = 'none'; } };
    </script>
</body>
</html>
