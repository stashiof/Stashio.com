<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <title>My Notes - Poysha POS</title>

    <meta name="theme-color" content="#3b82f6">
    <meta name="color-scheme" content="light dark">
    <script>
        const loggedInUser = localStorage.getItem('tempUserPhone') || sessionStorage.getItem('tempUserPhone') || localStorage.getItem('userPhone');
        const activeShopId = localStorage.getItem('activeShopId');
        if (!loggedInUser) {
            window.location.replace("index.html");
        } else if (!activeShopId) {
            window.location.replace("dashboard.html");
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #3b82f6; --primary-2: #2563eb; --pin: #f59e0b;
            --bg: #f1f5f9; --card: #ffffff; --input-bg: #f8fafc;
            --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
            --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
            --toast-bg: #1f2937; --mark-bg: #fde68a; --mark-text: inherit;
        }
        [data-theme="dark"] {
            --primary: #60a5fa; --primary-2: #3b82f6; --pin: #fbbf24;
            --bg: #0b1220; --card: #121b2e; --input-bg: #0d1526;
            --text: #e2e8f0; --muted: #94a3b8; --border: #1e2b45;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            --toast-bg: #334155; --mark-bg: #a16207; --mark-text: #fff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 40px; transition: background 0.3s, color 0.3s; }
        button { font-family: inherit; }

        /* ---------- HEADER ---------- */
        .app-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%); padding: 18px 16px 34px 16px; color: #fff; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; position: sticky; top: 0; z-index: 50; box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25); }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .header-left a { color: #fff; text-decoration: none; font-size: 17px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.15); border-radius: 10px; flex-shrink: 0; }
        .header-title { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-sub { display: flex; align-items: center; gap: 6px; font-size: 10.5px; opacity: 0.85; margin-top: 1px; font-weight: 500; }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: pulse 1.6s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
        .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: none; background: rgba(255,255,255,0.15); color: #fff; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
        .icon-btn:active { background: rgba(255,255,255,0.3); }
        .export-pill { height: 34px; padding: 0 13px; border-radius: 10px; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 11.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .export-pill:active { background: rgba(255,255,255,0.3); }

        /* ---------- ERROR BANNER ---------- */
        .load-error { display: none; margin: 15px; padding: 14px 16px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 14px; color: #b91c1c; font-size: 12.5px; line-height: 1.6; }
        .load-error code { background: #fee2e2; padding: 1px 6px; border-radius: 5px; font-size: 11px; }

        /* ---------- INPUT CARD ---------- */
        .note-input-container { background: var(--card); margin: -18px 15px 18px 15px; padding: 16px; border-radius: 18px; box-shadow: var(--shadow); position: relative; z-index: 60; border: 1px solid var(--border); }
        textarea { width: 100%; min-height: 96px; max-height: 260px; padding: 14px; border-radius: 14px; border: 1.5px solid var(--border); outline: none; font-size: 14px; font-family: inherit; resize: none; margin-bottom: 12px; background: var(--input-bg); color: var(--text); line-height: 1.55; transition: border-color 0.15s, background 0.3s; overflow-y: auto; }
        textarea:focus { border-color: var(--primary); }
        textarea::placeholder { color: var(--muted); opacity: 0.7; }

        .color-picker { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .color-label { font-size: 11px; color: var(--muted); font-weight: 600; }
        .color-dot { width: 27px; height: 27px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; transition: transform 0.15s, border-color 0.15s; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
        .color-dot.selected { border-color: var(--text); transform: scale(1.18); box-shadow: 0 3px 8px rgba(0,0,0,0.18); }

        .input-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .editing-badge { font-size: 11px; color: var(--primary); font-weight: 600; display: none; align-items: center; gap: 5px; }
        .editing-badge.show { display: flex; }
        .char-count { font-size: 11px; color: var(--muted); }
        .char-count.limit { color: #ef4444; font-weight: 700; }
        .btn-row { display: flex; gap: 10px; }
        .btn-save { flex: 1; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; padding: 13px; border: none; border-radius: 13px; font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity 0.15s, transform 0.1s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .btn-save:active { transform: scale(0.98); }
        .btn-save:disabled { opacity: 0.6; }
        .btn-cancel { display: none; background: var(--input-bg); color: var(--text); padding: 13px 18px; border: 1px solid var(--border); border-radius: 13px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn-cancel.show { display: block; }
        .shortcut-hint { text-align: right; font-size: 9.5px; color: var(--muted); margin-top: 8px; opacity: 0.8; }

        /* ---------- SEARCH ---------- */
        .search-container { padding: 0 15px; margin-bottom: 12px; position: relative; }
        .search-container > i { position: absolute; left: 31px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
        #searchInput { width: 100%; padding: 11px 40px 11px 38px; border-radius: 13px; border: 1.5px solid var(--border); outline: none; font-size: 13px; background: var(--card); color: var(--text); transition: border-color 0.15s; }
        #searchInput:focus { border-color: var(--primary); }
        .clear-search { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); background: var(--border); color: var(--muted); border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 10px; display: none; align-items: center; justify-content: center; }
        .clear-search.show { display: flex; }

        /* ---------- FILTERS ---------- */
        .filter-row { display: flex; align-items: center; gap: 8px; padding: 0 15px; margin-bottom: 14px; flex-wrap: wrap; }
        .chip { padding: 7px 14px; border-radius: 20px; background: var(--card); border: 1.5px solid var(--border); font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.15s; }
        .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3); }
        .notes-count { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 600; }
        .tool-btn { background: var(--card); border: 1.5px solid var(--border); border-radius: 11px; padding: 7px 11px; font-size: 11px; font-weight: 600; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s; }
        .tool-btn:active { background: var(--input-bg); }

        /* ---------- NOTES ---------- */
        .notes-list { padding: 0 15px; display: flex; flex-direction: column; gap: 12px; }
        .notes-list.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); align-items: start; }
        mark { background: var(--mark-bg); color: var(--mark-text); padding: 0 1px; border-radius: 3px; }

        .note-card { background: var(--card); padding: 15px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); border-left: 4px solid var(--primary); position: relative; animation: cardIn 0.25s ease both; transition: transform 0.15s; }
        .note-card:active { transform: scale(0.995); }
        @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .pin-tag { display: none; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700; color: var(--pin); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.5px; }
        .note-card.pinned .pin-tag { display: flex; }
        .note-text { font-size: 14px; color: var(--text); white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; line-height: 1.55; }
        .read-more-btn { background: none; border: none; color: var(--primary); font-weight: 700; font-size: 11.5px; cursor: pointer; padding: 0; margin-bottom: 8px; }
        .note-footer { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 9px; gap: 8px; }
        .note-time { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
        .note-actions { display: flex; gap: 13px; align-items: center; }
        .note-actions button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 0; transition: transform 0.1s; }
        .note-actions button:active { transform: scale(0.85); }
        .btn-pin { color: var(--pin); }
        .btn-copy { color: #10b981; }
        .btn-share { color: #8b5cf6; }
        .btn-edit { color: var(--primary); }
        .btn-delete { color: #ef4444; }

        .no-results { text-align: center; color: var(--muted); padding: 50px 0; grid-column: 1 / -1; }
        .no-results i { font-size: 34px; opacity: 0.35; margin-bottom: 12px; display: block; }
        .no-results .nr-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
        .no-results .nr-sub { font-size: 12px; }

        /* ---------- TOAST ---------- */
        .toast { position: fixed; bottom: 22px; left: 15px; right: 15px; background: var(--toast-bg); color: #fff; padding: 14px 16px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); z-index: 100; transform: translateY(100px); opacity: 0; transition: transform 0.25s ease, opacity 0.25s ease; gap: 10px; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast .t-msg { display: flex; align-items: center; gap: 9px; }
        .toast button { background: none; border: none; color: #60a5fa; font-weight: 700; cursor: pointer; font-size: 13px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-top">
            <div class="header-left">
                <a href="home.html"><i class="fas fa-arrow-left"></i></a>
                <div>
                    <div class="header-title">My Notes</div>
                    <div class="header-sub"><span class="live-dot"></span><span id="syncText">Live sync on</span></div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="Theme"><i class="fas fa-moon" id="themeIcon"></i></button>
                <button class="export-pill" onclick="exportNotes()"><i class="fas fa-file-export"></i> Export</button>
            </div>
        </div>
    </div>

    <div class="load-error" id="loadError">
        <b><i class="fas fa-triangle-exclamation"></i> Connection failed!</b><br>
        Could not load <code>firebase_config.js</code>. Make sure the file exists in the same folder and check Console (F12) for details.
    </div>

    <div class="note-input-container">
        <textarea id="noteText" placeholder="Write something you want to remember..." maxlength="1000" oninput="onNoteInput()"></textarea>
        <div class="color-picker" id="colorPicker"></div>
        <div class="input-meta">
            <span class="editing-badge" id="editingBadge"><i class="fas fa-pen"></i> Editing note</span>
            <span class="char-count" id="charCount">0 / 1000</span>
        </div>
        <div class="btn-row">
            <button onclick="cancelEdit()" id="cancelBtn" class="btn-cancel">Cancel</button>
            <button onclick="saveNote()" id="saveBtn" class="btn-save"><i class="fas fa-save"></i> Save Note</button>
        </div>
        <div class="shortcut-hint">Ctrl + Enter to save &nbsp;•&nbsp; Esc to cancel</div>
    </div>

    <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search notes..." oninput="onSearchInput()">
        <button class="clear-search" id="clearSearch" onclick="clearSearch()"><i class="fas fa-xmark"></i></button>
    </div>

    <div class="filter-row">
        <button class="chip active" id="chipAll" onclick="setFilter('all')">All</button>
        <button class="chip" id="chipPinned" onclick="setFilter('pinned')">Pinned</button>
        <button class="tool-btn" id="sortBtn" onclick="toggleSort()"><i class="fas fa-arrow-down-wide-short"></i> Newest</button>
        <button class="tool-btn" id="viewBtn" onclick="toggleView()"><i class="fas fa-table-cells-large"></i></button>
        <span class="notes-count" id="notesCount"></span>
    </div>

    <div class="notes-list" id="notesList">
        <div class="no-results"><i class="fas fa-spinner fa-spin"></i></div>
    </div>

    <div class="toast" id="toast">
        <span class="t-msg"><i class="fas fa-circle-check" id="toastIcon"></i><span id="toastMsg">Done</span></span>
        <button id="toastUndoBtn" onclick="undoDelete()">UNDO</button>
    </div>

    <!-- Watchdog: if module fails to load, show visible error instead of silent death -->
    <script>
        window.__notesReady = false;
        setTimeout(() => {
            if (!window.__notesReady) {
                document.getElementById('loadError').style.display = 'block';
                const list = document.getElementById('notesList');
                if (list) list.innerHTML = '';
            }
        }, 4000);
    </script>

    <script type="module">
        // NOTE: 'set' is not exported from firebase_config.js, so we import it from CDN directly.
        import { rtdb, ref as rtdbRef, push, update, onValue as rtdbOnValue, remove } from './firebase_config.js';
        import { set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        window.__notesReady = true; // module loaded successfully

        const SHOP_ID = localStorage.getItem('activeShopId');
        const DRAFT_KEY = `noteDraft_${SHOP_ID}`;
        const MAX_LEN = 1000;
        const READ_MORE_LEN = 220;

        const COLOR_MAP = {
            yellow: { border: '#f59e0b', light: '#fef9c3', dark: 'rgba(245,158,11,0.14)' },
            green:  { border: '#22c55e', light: '#dcfce7', dark: 'rgba(34,197,94,0.14)' },
            blue:   { border: '#3b82f6', light: '#dbeafe', dark: 'rgba(59,130,246,0.16)' },
            purple: { border: '#a855f7', light: '#f3e8ff', dark: 'rgba(168,85,247,0.15)' },
            pink:   { border: '#ec4899', light: '#fce7f3', dark: 'rgba(236,72,153,0.14)' },
            orange: { border: '#f97316', light: '#ffedd5', dark: 'rgba(249,115,22,0.14)' }
        };

        let allNotes = [];
        let editingId = null;
        let lastDeleted = null;
        let toastTimer = null;
        let filterMode = 'all';
        let sortMode = 'newest';
        let selectedColor = '';
        const expandedIds = new Set();

        // ---------- THEME ----------
        window.toggleTheme = () => {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('appTheme', next);
            document.getElementById('themeIcon').className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', next === 'dark' ? '#0b1220' : '#3b82f6');
            renderColorPicker();
            renderNotes();
        };
        (function initTheme() {
            const saved = localStorage.getItem('appTheme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        })();

        // ---------- INIT ----------
        window.onload = () => {
            rtdbOnValue(rtdbRef(rtdb, `notes/${SHOP_ID}`), (snap) => {
                allNotes = snap.exists() ? Object.entries(snap.val()).map(([id, val]) => ({ id, ...val })) : [];
                renderNotes();
            }, (err) => {
                document.getElementById('syncText').textContent = 'Sync error: ' + err.code;
            });

            const draft = localStorage.getItem(DRAFT_KEY);
            if (draft && draft.trim()) {
                document.getElementById('noteText').value = draft;
                showToast('Draft restored', 'fa-clock-rotate-left', false);
            }
            renderColorPicker();
            updateCharCount();
            autoGrow();
        };

        // ---------- HELPERS ----------
        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str == null ? '' : String(str);
            return d.innerHTML;
        }

        // Safe highlight: split raw text, escape each part, wrap matches in <mark>
        function highlightAndEscape(text, query) {
            if (!query) return escapeHtml(text);
            const lower = text.toLowerCase();
            const q = query.toLowerCase();
            let result = '', i = 0;
            while (i < text.length) {
                const idx = lower.indexOf(q, i);
                if (idx === -1) { result += escapeHtml(text.slice(i)); break; }
                result += escapeHtml(text.slice(i, idx));
                result += '<mark>' + escapeHtml(text.slice(idx, idx + q.length)) + '</mark>';
                i = idx + q.length;
            }
            return result;
        }

        function formatDate(ts) {
            const d = new Date(ts);
            const now = new Date();
            const yest = new Date(now); yest.setDate(now.getDate() - 1);
            const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (d.toDateString() === now.toDateString()) return `Today at ${time}`;
            if (d.toDateString() === yest.toDateString()) return `Yesterday at ${time}`;
            return `${d.toLocaleDateString('en-GB')} at ${time}`;
        }

        function isDark() {
            return document.documentElement.getAttribute('data-theme') === 'dark';
        }

        function autoGrow() {
            const ta = document.getElementById('noteText');
            ta.style.height = 'auto';
            ta.style.height = Math.min(ta.scrollHeight, 260) + 'px';
        }

        // ---------- INPUT ----------
        window.onNoteInput = () => {
            updateCharCount();
            autoGrow();
            if (!editingId) localStorage.setItem(DRAFT_KEY, document.getElementById('noteText').value);
        };

        window.onSearchInput = () => {
            const v = document.getElementById('searchInput').value;
            document.getElementById('clearSearch').classList.toggle('show', v.length > 0);
            renderNotes();
        };

        window.clearSearch = () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearch').classList.remove('show');
            renderNotes();
        };

        window.updateCharCount = () => {
            const len = document.getElementById('noteText').value.length;
            const el = document.getElementById('charCount');
            el.textContent = `${len} / ${MAX_LEN}`;
            el.classList.toggle('limit', len >= MAX_LEN);
        };

        // ---------- COLOR PICKER ----------
        window.selectColor = (key) => {
            selectedColor = key;
            renderColorPicker();
        };

        function renderColorPicker() {
            const picker = document.getElementById('colorPicker');
            const colors = [{ key: '', bg: isDark() ? 'var(--input-bg)' : '#ffffff', check: selectedColor === '' },
                ...Object.entries(COLOR_MAP).map(([k, v]) => ({ key: k, bg: isDark() ? v.dark : v.light, check: selectedColor === k }))];
            picker.innerHTML = '<span class="color-label"><i class="fas fa-palette"></i> Color:</span>' +
                colors.map(c => `<div class="color-dot ${c.check ? 'selected' : ''}" style="background:${c.bg}"
                    title="${c.key || 'Default'}" onclick="selectColor('${c.key}')">
                    ${c.check ? '<i class="fas fa-check"></i>' : ''}</div>`).join('');
        }

        // ---------- RENDER ----------
        window.renderNotes = () => {
            const list = document.getElementById('notesList');
            const query = document.getElementById('searchInput').value.trim().toLowerCase();

            document.getElementById('chipAll').textContent = `All (${allNotes.length})`;
            document.getElementById('chipPinned').textContent = `Pinned (${allNotes.filter(n => !!n.pinned).length})`;

            let notes = [...allNotes];
            if (filterMode === 'pinned') notes = notes.filter(n => !!n.pinned);
            if (query) notes = notes.filter(n => (n.text || '').toLowerCase().includes(query));

            document.getElementById('notesCount').textContent = `${notes.length} shown`;

            notes.sort((a, b) => {
                if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
                return sortMode === 'newest' ? b.created_at - a.created_at : a.created_at - b.created_at;
            });

            if (notes.length === 0) {
                list.innerHTML = query
                    ? `<div class="no-results"><i class="fas fa-magnifying-glass"></i><div class="nr-title">No matches</div><div class="nr-sub">No notes match "${escapeHtml(query)}"</div></div>`
                    : filterMode === 'pinned'
                        ? '<div class="no-results"><i class="fas fa-thumbtack"></i><div class="nr-title">No pinned notes</div><div class="nr-sub">Pin important notes to find them fast</div></div>'
                        : '<div class="no-results"><i class="fas fa-clipboard"></i><div class="nr-title">No notes yet</div><div class="nr-sub">Write your first note above ☝️</div></div>';
                return;
            }

            const dark = isDark();
            list.innerHTML = notes.map(note => {
                const cm = note.color && COLOR_MAP[note.color] ? COLOR_MAP[note.color] : null;
                const borderColor = cm ? cm.border : (note.pinned ? 'var(--pin)' : 'var(--primary)');
                const bg = cm ? (dark ? cm.dark : cm.light) : 'var(--card)';

                const isLong = (note.text || '').length > READ_MORE_LEN;
                const expanded = expandedIds.has(note.id);
                let displayText = note.text || '';
                if (isLong && !expanded) displayText = displayText.slice(0, READ_MORE_LEN) + '…';

                const highlighted = highlightAndEscape(displayText, query);
                const createdStr = formatDate(note.created_at);
                const editedStr = note.updated_at ? `<span>Edited ${formatDate(note.updated_at)}</span>` : '';

                return `
                <div class="note-card ${note.pinned ? 'pinned' : ''}" style="border-left-color:${borderColor}; background:${bg};">
                    <div class="pin-tag"><i class="fas fa-thumbtack"></i> Pinned</div>
                    <div class="note-text">${highlighted}</div>
                    ${isLong ? `<button class="read-more-btn" onclick="toggleExpand('${note.id}')">${expanded ? 'Show less' : 'Read more'}</button>` : ''}
                    <div class="note-footer">
                        <div class="note-time">
                            <span>${createdStr}</span>
                            ${editedStr}
                        </div>
                        <div class="note-actions">
                            <button onclick="togglePin('${note.id}', ${!!note.pinned})" class="btn-pin" title="Pin"><i class="fas fa-thumbtack"></i></button>
                            <button onclick="copyNote('${note.id}')" class="btn-copy" title="Copy"><i class="far fa-copy"></i></button>
                            <button onclick="shareNote('${note.id}')" class="btn-share" title="Share"><i class="fas fa-share-alt"></i></button>
                            <button onclick="editNote('${note.id}')" class="btn-edit" title="Edit"><i class="fas fa-pen"></i></button>
                            <button onclick="deleteNote('${note.id}')" class="btn-delete" title="Delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        };

        // ---------- CRUD ----------
        window.saveNote = async () => {
            const textEl = document.getElementById('noteText');
            const text = textEl.value.trim();
            if (!text) { showToast('Write something first', 'fa-pen', false); return; }

            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            try {
                if (editingId) {
                    const existing = allNotes.find(n => n.id === editingId);
                    if (existing && existing.text === text && (existing.color || '') === selectedColor) {
                        cancelEdit();
                    } else {
                        await update(rtdbRef(rtdb, `notes/${SHOP_ID}/${editingId}`), { text, color: selectedColor, updated_at: Date.now() });
                        cancelEdit();
                        showToast('Note updated', 'fa-check', false);
                    }
                } else {
                    await push(rtdbRef(rtdb, `notes/${SHOP_ID}`), { text, color: selectedColor, created_at: Date.now(), pinned: false });
                    textEl.value = '';
                    selectedColor = '';
                    renderColorPicker();
                    localStorage.removeItem(DRAFT_KEY);
                    updateCharCount();
                    autoGrow();
                    showToast('Note saved', 'fa-check', false);
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'fa-triangle-exclamation', false);
            } finally {
                btn.innerHTML = '<i class="fas fa-save"></i> Save Note';
                btn.disabled = false;
            }
        };

        window.editNote = (id) => {
            const note = allNotes.find(n => n.id === id);
            if (!note) return;
            editingId = id;
            selectedColor = note.color || '';
            renderColorPicker();
            document.getElementById('noteText').value = note.text;
            updateCharCount();
            autoGrow();
            document.getElementById('saveBtn').innerHTML = '<i class="fas fa-check"></i> Update Note';
            document.getElementById('cancelBtn').classList.add('show');
            document.getElementById('editingBadge').classList.add('show');
            document.getElementById('noteText').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = () => {
            editingId = null;
            selectedColor = '';
            renderColorPicker();
            document.getElementById('noteText').value = '';
            localStorage.removeItem(DRAFT_KEY);
            updateCharCount();
            autoGrow();
            document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> Save Note';
            document.getElementById('cancelBtn').classList.remove('show');
            document.getElementById('editingBadge').classList.remove('show');
        };

        window.togglePin = async (id, currentlyPinned) => {
            await update(rtdbRef(rtdb, `notes/${SHOP_ID}/${id}`), { pinned: !currentlyPinned });
        };

        window.deleteNote = async (id) => {
            const note = allNotes.find(n => n.id === id);
            if (!note) return;
            if (editingId === id) cancelEdit();
            lastDeleted = note;
            await remove(rtdbRef(rtdb, `notes/${SHOP_ID}/${id}`));
            showToast('Note deleted', 'fa-trash', true);
        };

        window.undoDelete = async () => {
            if (!lastDeleted) return;
            const { id, ...data } = lastDeleted;
            await set(rtdbRef(rtdb, `notes/${SHOP_ID}/${id}`), data);
            lastDeleted = null;
            hideToast();
        };

        // ---------- EXTRA ACTIONS ----------
        window.copyNote = async (id) => {
            const note = allNotes.find(n => n.id === id);
            if (!note) return;
            try {
                await navigator.clipboard.writeText(note.text);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = note.text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            showToast('Copied to clipboard', 'fa-copy', false);
        };

        window.shareNote = async (id) => {
            const note = allNotes.find(n => n.id === id);
            if (!note) return;
            if (navigator.share) {
                try { await navigator.share({ title: 'My Note - Poysha POS', text: note.text }); } catch {}
            } else {
                window.copyNote(id);
            }
        };

        window.toggleExpand = (id) => {
            expandedIds.has(id) ? expandedIds.delete(id) : expandedIds.add(id);
            renderNotes();
        };

        window.setFilter = (mode) => {
            filterMode = mode;
            document.getElementById('chipAll').classList.toggle('active', mode === 'all');
            document.getElementById('chipPinned').classList.toggle('active', mode === 'pinned');
            renderNotes();
        };

        window.toggleSort = () => {
            sortMode = sortMode === 'newest' ? 'oldest' : 'newest';
            document.getElementById('sortBtn').innerHTML = sortMode === 'newest'
                ? '<i class="fas fa-arrow-down-wide-short"></i> Newest'
                : '<i class="fas fa-arrow-up-wide-short"></i> Oldest';
            renderNotes();
        };

        window.toggleView = () => {
            const list = document.getElementById('notesList');
            const isGrid = list.classList.toggle('grid-view');
            document.getElementById('viewBtn').innerHTML = isGrid
                ? '<i class="fas fa-list"></i>'
                : '<i class="fas fa-table-cells-large"></i>';
        };

        window.exportNotes = () => {
            if (allNotes.length === 0) { showToast('No notes to export', 'fa-file-export', false); return; }
            let content = `MY NOTES - Poysha POS\nExported: ${new Date().toLocaleString()}\nTotal: ${allNotes.length} notes\n${'='.repeat(40)}\n\n`;
            [...allNotes]
                .sort((a, b) => (!!b.pinned - !!a.pinned) || (b.created_at - a.created_at))
                .forEach((n, i) => {
                    content += `[${i + 1}] ${n.pinned ? '[PINNED] ' : ''}${formatDate(n.created_at)}\n${n.text}\n\n${'-'.repeat(40)}\n\n`;
                });
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `notes-${new Date().toISOString().slice(0, 10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Notes exported', 'fa-download', false);
        };

        // ---------- TOAST ----------
        function showToast(msg, icon = 'fa-circle-check', showUndo = false) {
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toastIcon').className = 'fas ' + icon;
            document.getElementById('toastUndoBtn').style.display = showUndo ? 'block' : 'none';
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, 5000);
        }
        function hideToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // ---------- KEYBOARD ----------
        document.getElementById('noteText').addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                window.saveNote();
            }
            if (e.key === 'Escape' && editingId) {
                window.cancelEdit();
            }
        });
    </script>
</body>
</html>
