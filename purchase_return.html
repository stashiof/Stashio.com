<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <title>Purchase Return - Poysha POS</title>
    
    <meta name="theme-color" content="#f97316">
    <script>
        const loggedInUser = localStorage.getItem('tempUserPhone') || sessionStorage.getItem('tempUserPhone') || localStorage.getItem('userPhone');
        const activeShopId = localStorage.getItem('activeShopId');
        if (!loggedInUser) window.location.replace("index.html");
        else if (!activeShopId) window.location.replace("dashboard.html");
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            --primary: #f97316; --secondary: #c2410c; --bg-color: #f8fafc;
            --white: #ffffff; --text-dark: #1e293b; --text-light: #64748b;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --border-radius: 18px; --shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding-bottom: 120px; position: relative; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* App Header */
        .app-header { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); 
            padding: 22px 20px 45px 20px; color: white; border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; 
            position: sticky; top: 0; z-index: 50; box-shadow: 0 8px 25px rgba(249, 115, 22, 0.25); 
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-title { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
        .header-title a { color: white; text-decoration: none; }

        /* Search Card */
        .search-card { 
            background: var(--white); margin: -25px 15px 15px 15px; padding: 16px; 
            border-radius: var(--border-radius); box-shadow: var(--shadow); position: relative; z-index: 60; 
            border: 1px solid #f1f5f9;
        }
        .search-box { display: flex; gap: 8px; position: relative; }
        .search-input-wrap { flex: 1; position: relative; }
        .search-input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .search-input-wrap input { width: 100%; padding: 12px 14px 12px 38px; border-radius: 14px; border: 1px solid #e2e8f0; outline: none; font-size: 13px; font-family: inherit; background: #f8fafc; color: var(--text-dark); }
        .search-input-wrap input:focus { border-color: var(--primary); background: white; }
        .btn-scan { background: var(--text-dark); color: white; border: none; width: 46px; border-radius: 14px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }

        /* Recent Challans Carousel */
        .recent-section { margin-top: 12px; }
        .recent-title { font-size: 10.5px; font-weight: 800; color: var(--text-light); text-transform: uppercase; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .recent-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .challan-chip { background: #f1f5f9; padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; color: var(--text-dark); border: 1px solid #e2e8f0; cursor: pointer; white-space: nowrap; transition: 0.2s; display: flex; flex-direction: column; text-align: left; }
        .challan-chip:active { transform: scale(0.95); }
        .challan-chip.active { background: #ffedd5; border-color: var(--primary); color: var(--secondary); }
        .challan-chip .chip-no { font-weight: 800; font-family: monospace; font-size: 11.5px; }
        .challan-chip .chip-supp { font-size: 9.5px; color: var(--text-light); }

        /* Challan Details Box */
        .challan-details-box { 
            background: var(--white); margin: 0 15px 15px 15px; padding: 16px; border-radius: var(--border-radius); 
            box-shadow: var(--shadow); border: 1px dashed var(--primary); display: none; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        
        .inv-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
        .inv-row:last-child { margin-bottom: 0; }
        .inv-row span { color: var(--text-light); }
        .inv-row strong { color: var(--text-dark); font-weight: 700; }

        /* Item Cards */
        .item-list { padding: 0 15px; display: flex; flex-direction: column; gap: 10px; }
        .item-card { background: white; padding: 14px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid #f1f5f9; }
        .item-name { font-size: 13.5px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        
        .item-controls { display: flex; justify-content: space-between; align-items: center; background: #fff7ed; padding: 8px 12px; border-radius: 12px; margin-top: 10px; }
        .qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 30px; height: 30px; border: none; background: white; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); color: var(--primary); font-size: 14px; }
        .qty-input { width: 40px; text-align: center; border: none; background: transparent; font-weight: 800; font-size: 14px; color: var(--primary); outline: none; }
        
        .btn-return-all { font-size: 10px; font-weight: 700; background: #ffedd5; color: var(--secondary); border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; }

        /* Bottom Action Footer */
        .bottom-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: white; 
            padding: 15px 20px; box-shadow: 0 -5px 25px rgba(0,0,0,0.08); 
            border-top-left-radius: 25px; border-top-right-radius: 25px; 
            display: flex; justify-content: space-between; align-items: center; z-index: 100; 
        }
        .btn-confirm { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 14px 24px; border: none; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); transition: 0.2s; }
        .btn-confirm:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }

        #scannerModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #reader { width: 100%; max-width: 320px; border-radius: 20px; overflow: hidden; border: 3px solid var(--primary); }
        .btn-close-scanner { margin-top: 25px; background: white; color: var(--danger); border: none; padding: 10px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-top">
            <div class="header-title">
                <a href="home.html"><i class="fas fa-arrow-left"></i></a>
                <span>Purchase Return (ক্রয় ফেরত)</span>
            </div>
        </div>
    </div>

    <!-- Search & Fast Picker -->
    <div class="search-card">
        <label style="font-size: 10px; font-weight: 700; color: var(--text-light); text-transform: uppercase; margin-bottom: 6px; display: block;">Search Challan or Supplier</label>
        <div class="search-box">
            <div class="search-input-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search supplier or challan no..." oninput="filterPurchasesList()">
            </div>
            <button onclick="startScanner()" class="btn-scan"><i class="fas fa-barcode"></i></button>
        </div>

        <div class="recent-section">
            <div class="recent-title">
                <span>Recent Challans (সাম্প্রতিক ক্রয় চালান)</span>
                <span id="recentCount" style="color:var(--primary)">0 found</span>
            </div>
            <div class="recent-chips" id="recentChips">
                <div style="font-size:11px; color:#94a3b8; padding:5px 0;">চালান লোড হচ্ছে...</div>
            </div>
        </div>
    </div>

    <!-- Selected Challan Details -->
    <div id="challanDetails" class="challan-details-box">
        <div class="inv-row"><span>Supplier:</span> <strong id="dSupplier"></strong></div>
        <div class="inv-row"><span>Challan No:</span> <strong id="dChallanNo" style="font-family:monospace; color:var(--primary);"></strong></div>
        <div class="inv-row"><span>Purchase Date:</span> <strong id="dDate"></strong></div>
        <div class="inv-row"><span>Original Bill:</span> <strong id="dTotal"></strong></div>
        <div class="inv-row"><span>Paid / Due:</span> <strong id="dPaidDue" style="color:#059669;"></strong></div>
    </div>

    <!-- Item Return List -->
    <div class="item-list" id="itemList">
        <div style="text-align: center; color: #94a3b8; padding: 40px 0; font-size: 13px;">
            <i class="fas fa-file-invoice-dollar" style="font-size: 40px; margin-bottom: 10px; opacity: 0.5;"></i><br>
            উপরের তালিকা থেকে যেকোনো চালান সিলেক্ট করুন বা সার্চ করুন।
        </div>
    </div>

    <!-- Floating Confirmation Footer -->
    <div class="bottom-bar">
        <div>
            <p style="margin:0; font-size: 10.5px; color: var(--text-light); font-weight: 700; text-transform:uppercase;">Receivable Amount</p>
            <h3 style="margin:0; font-size: 20px; color: var(--primary); font-weight: 800;" id="refundTotal">৳0</h3>
        </div>
        <button id="btnProcess" class="btn-confirm" disabled onclick="processReturn()">Confirm Return</button>
    </div>

    <div id="scannerModal">
        <div id="reader"></div>
        <button onclick="stopScanner()" class="btn-close-scanner">Close Camera</button>
    </div>

    <script type="module">
        import { rtdb, ref as rtdbRef, get, update, push } from './firebase_config.js';
        import { runTransaction, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const SHOP_ID = localStorage.getItem('activeShopId');
        let allPurchases = [];
        let currentChallanData = null;
        let returnCart = {}; 
        let html5QrcodeScanner = null;

        window.onload = async () => {
            loadRecentChallans();
        };

        async function loadRecentChallans() {
            try {
                const snap = await get(query(rtdbRef(rtdb, 'purchase_history'), orderByChild('shop_id'), equalTo(SHOP_ID)));
                if(snap.exists()) {
                    allPurchases = Object.entries(snap.val())
                        .map(([id, val]) => ({ id, ...val }))
                        .reverse();
                    renderRecentChips(allPurchases.slice(0, 15));
                } else {
                    document.getElementById('recentChips').innerHTML = '<div style="font-size:11px; color:#94a3b8;">কোনো ক্রয়ের তথ্য নেই।</div>';
                }
            } catch(e) {
                console.error(e);
            }
        }

        function renderRecentChips(list) {
            const container = document.getElementById('recentChips');
            container.innerHTML = '';
            document.getElementById('recentCount').innerText = `${list.length}টি`;

            if(list.length === 0) {
                container.innerHTML = '<div style="font-size:11px; color:#94a3b8; padding:5px;">কোনো চালান পাওয়া যায়নি।</div>';
                return;
            }

            list.forEach(pur => {
                const chip = document.createElement('div');
                chip.className = `challan-chip ${currentChallanData && currentChallanData.id === pur.id ? 'active' : ''}`;
                chip.innerHTML = `
                    <span class="chip-no">${pur.challan_no || 'N/A'}</span>
                    <span class="chip-supp">${(pur.supplier || 'Local').slice(0, 14)} • ৳${pur.total_amount || 0}</span>
                `;
                chip.onclick = () => selectChallan(pur);
                container.appendChild(chip);
            });
        }

        window.filterPurchasesList = () => {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            if(!term) {
                renderRecentChips(allPurchases.slice(0, 15));
                return;
            }
            const filtered = allPurchases.filter(p => 
                (p.challan_no && p.challan_no.toLowerCase().includes(term)) ||
                (p.supplier && p.supplier.toLowerCase().includes(term))
            );
            renderRecentChips(filtered.slice(0, 20));

            const exact = filtered.find(p => p.challan_no && p.challan_no.toLowerCase() === term);
            if(exact) selectChallan(exact);
        };

        window.selectChallan = (pur) => {
            currentChallanData = pur;
            document.querySelectorAll('.challan-chip').forEach(c => c.classList.remove('active'));
            renderRecentChips(allPurchases.slice(0, 15));

            document.getElementById('dSupplier').innerText = pur.supplier || 'Local';
            document.getElementById('dChallanNo').innerText = pur.challan_no || 'N/A';
            document.getElementById('dDate').innerText = new Date(pur.created_at || pur.date).toLocaleDateString('en-GB');
            document.getElementById('dTotal').innerText = `৳${Number(pur.total_amount || 0).toLocaleString()}`;
            document.getElementById('dPaidDue').innerText = `Paid: ৳${pur.paid_amount || 0} | Due: ৳${pur.due_amount || 0}`;
            document.getElementById('challanDetails').style.display = 'block';

            renderChallanItems();
        };

        function renderChallanItems() {
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';
            returnCart = {}; 

            if(!currentChallanData.items || currentChallanData.items.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:var(--danger); font-weight:bold; padding:20px;">এই চালানে কোনো পণ্য অবশিষ্ট নেই।</div>';
                calculateRefund();
                return;
            }

            currentChallanData.items.forEach((item, index) => {
                const maxReturnable = Number(item.qty || 0);
                if (maxReturnable > 0) {
                    returnCart[index] = 0; 
                    const rate = Number(item.purchaseRate || item.buy_price || 0);

                    const html = `
                    <div class="item-card">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div class="item-name">${item.name}</div>
                            <button class="btn-return-all" onclick="returnMaxItem(${index}, ${maxReturnable})">Return All (${maxReturnable})</button>
                        </div>
                        <div style="font-size: 11.5px; color: var(--text-light); display: flex; justify-content: space-between; margin-top:2px;">
                            <span>Bought Qty: <b style="color:var(--text-dark);">${maxReturnable} ${item.unit || 'pcs'}</b></span>
                            <span style="color: var(--primary); font-weight: bold;">Rate: ৳${rate}</span>
                        </div>
                        <div class="item-controls">
                            <span style="font-size: 12px; font-weight: 700;">ফেরতের পরিমাণ:</span>
                            <div class="qty-controls">
                                <button onclick="changeQty(${index}, -1, ${maxReturnable})" class="qty-btn"><i class="fas fa-minus"></i></button>
                                <input type="number" id="qty_${index}" value="0" class="qty-input" readonly>
                                <button onclick="changeQty(${index}, 1, ${maxReturnable})" class="qty-btn"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>`;
                    listEl.insertAdjacentHTML('beforeend', html);
                }
            });

            calculateRefund();
        }

        window.returnMaxItem = (index, maxAllowed) => {
            returnCart[index] = maxAllowed;
            document.getElementById(`qty_${index}`).value = maxAllowed;
            calculateRefund();
        };

        window.changeQty = (itemIndex, change, maxAllowed) => {
            let current = returnCart[itemIndex] || 0;
            let newQty = current + change;
            
            if(newQty < 0) newQty = 0;
            if(newQty > maxAllowed) newQty = maxAllowed;
            
            returnCart[itemIndex] = newQty;
            document.getElementById(`qty_${itemIndex}`).value = newQty;
            calculateRefund();
        };

        function calculateRefund() {
            let totalRefund = 0;
            let hasItemsToReturn = false;

            if(currentChallanData && currentChallanData.items) {
                currentChallanData.items.forEach((item, index) => {
                    const rQty = returnCart[index] || 0;
                    if(rQty > 0) {
                        const rate = Number(item.purchaseRate || item.buy_price || 0);
                        totalRefund += (rQty * rate);
                        hasItemsToReturn = true;
                    }
                });
            }

            document.getElementById('refundTotal').innerText = `৳${totalRefund.toLocaleString()}`;
            document.getElementById('btnProcess').disabled = !hasItemsToReturn;
        }

        window.processReturn = async () => {
            if(!confirm("আপনি কি নিশ্চিত? পণ্যগুলো স্টক থেকে বিয়োগ হবে এবং ক্রয় খাতা সমন্বয় হবে।")) return;
            
            const btn = document.getElementById('btnProcess');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...'; 
            btn.disabled = true;

            let totalRefund = 0;
            let returnedItemsLog = [];
            let finalInvoiceItems = [];
            const updates = {};

            currentChallanData.items.forEach((item, index) => {
                const rQty = returnCart[index] || 0;
                const rate = Number(item.purchaseRate || item.buy_price || 0);
                
                if(rQty > 0) {
                    totalRefund += (rQty * rate);
                    returnedItemsLog.push({ id: item.id, name: item.name, qty_returned: rQty, rate: rate });
                }

                const remainingQty = item.qty - rQty;
                if(remainingQty > 0) {
                    finalInvoiceItems.push({ ...item, qty: remainingQty });
                }
            });

            try {
                // 1. Deduct returned items from Stock atomically
                for (let log of returnedItemsLog) {
                    await runTransaction(rtdbRef(rtdb, `product_list/${log.id}/stock`), (currentStock) => {
                        let newStock = (Number(currentStock) || 0) - log.qty_returned;
                        return newStock < 0 ? 0 : newStock;
                    });
                }

                let cashToReceive = 0;

                // 2. Update Purchase History
                if (finalInvoiceItems.length === 0) {
                    updates[`purchase_history/${currentChallanData.id}`] = null;
                    let currentDue = Number(currentChallanData.due_amount || 0);
                    let deductFromDue = Math.min(totalRefund, currentDue);
                    cashToReceive = totalRefund - deductFromDue;
                } else {
                    let newTotal = Number(currentChallanData.total_amount || 0) - totalRefund;
                    let newSubtotal = Number(currentChallanData.subtotal || currentChallanData.total_amount || 0) - totalRefund;
                    let currentPaid = Number(currentChallanData.paid_amount || 0);
                    let currentDue = Number(currentChallanData.due_amount || 0);

                    let deductFromDue = Math.min(totalRefund, currentDue);
                    currentDue -= deductFromDue;
                    cashToReceive = totalRefund - deductFromDue;
                    currentPaid -= cashToReceive;
                    if(currentPaid < 0) currentPaid = 0;

                    updates[`purchase_history/${currentChallanData.id}/items`] = finalInvoiceItems;
                    updates[`purchase_history/${currentChallanData.id}/total_amount`] = newTotal;
                    updates[`purchase_history/${currentChallanData.id}/subtotal`] = newSubtotal; 
                    updates[`purchase_history/${currentChallanData.id}/paid_amount`] = currentPaid;
                    updates[`purchase_history/${currentChallanData.id}/due_amount`] = currentDue;
                    updates[`purchase_history/${currentChallanData.id}/has_returns`] = true; 
                }

                // 3. Add to Cashbox if supplier refunded in cash
                if (cashToReceive > 0) {
                    await runTransaction(rtdbRef(rtdb, `cash_settings/${SHOP_ID}/current_balance`), (bal) => (bal || 0) + cashToReceive);
                    await push(rtdbRef(rtdb, 'cash_transactions'), {
                        shop_id: SHOP_ID, type: 'cash_in', source: 'purchase_return',
                        amount: cashToReceive, note: `Refund from Supplier (Challan: ${currentChallanData.challan_no})`, created_at: Date.now()
                    });
                }

                // 4. Save Return Log
                await push(rtdbRef(rtdb, 'purchase_return_history'), {
                    shop_id: SHOP_ID, supplier: currentChallanData.supplier, 
                    challan_no: currentChallanData.challan_no, returned_items: returnedItemsLog, 
                    total_refund: totalRefund, cash_received: cashToReceive, date: Date.now()
                });

                await update(rtdbRef(rtdb), updates);

                alert("ক্রয় ফেরত সফল হয়েছে! স্টক থেকে পণ্য কমানো হয়েছে এবং ক্রয় খাতা সমন্বয় করা হয়েছে।");
                location.reload(); 

            } catch (err) {
                alert("Error: " + err.message);
                btn.innerHTML = 'Confirm Return'; btn.disabled = false;
            }
        };

        // --- SCANNER ---
        window.startScanner = () => {
            document.getElementById('scannerModal').style.display = 'flex';
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 280, height: 140 } }, (text) => {
                window.stopScanner();
                document.getElementById('searchInput').value = text;
                filterPurchasesList();
            }).catch(err => { window.stopScanner(); });
        };
        window.stopScanner = () => { if(html5QrcodeScanner) html5QrcodeScanner.stop(); document.getElementById('scannerModal').style.display = 'none'; };
    </script>
</body>
</html>
