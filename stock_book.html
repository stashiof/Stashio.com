<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <title>Stock Book - Poysha POS</title>
    
    <meta name="theme-color" content="#0B4A3E">

    <script>
        const loggedInUser = localStorage.getItem('tempUserPhone') || sessionStorage.getItem('tempUserPhone') || localStorage.getItem('userPhone');
        const activeShopId = localStorage.getItem('activeShopId');
        if (!loggedInUser) window.location.replace("index.html");
        else if (!activeShopId) window.location.replace("dashboard.html");
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0B4A3E; --secondary: #D4A017; --bg-color: #f3f4f6;
            --white: #ffffff; --text-dark: #1f2937; --text-light: #6b7280;
            --danger: #ef4444; --success: #10b981; --warning: #f59e0b; --blue: #3b82f6;
            --border-radius: 16px; --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-dark); overflow-x: hidden; padding-bottom: 30px; position: relative; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Header Area */
        .app-header {
            position: relative; padding: 20px 20px 45px 20px; color: white; 
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; 
            z-index: 50; box-shadow: 0 10px 20px rgba(11, 74, 62, 0.24); overflow: hidden;
        }
        .header-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--primary) 0%, #12604F 100%); z-index: 1; }
        #dynamicThemeContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: hidden; }
        
        .header-top { position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-title { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
        .header-title a { color: white; text-decoration: none; }
        
        .header-actions { display: flex; gap: 8px; }
        .btn-header { background: rgba(255,255,255,0.2); border: none; padding: 8px 12px; border-radius: 10px; color: white; font-size: 12px; font-weight: 600; cursor: pointer; backdrop-filter: blur(5px); display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-header:active { transform: scale(0.95); }

        /* Analytics Dashboard */
        .analytics-container { margin: -30px 15px 15px 15px; position: relative; z-index: 60; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { background: var(--white); padding: 15px; border-radius: 14px; box-shadow: var(--shadow); text-align: center; border: 1px solid #f8fafc; }
        .stat-card.full { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        
        .stat-title { font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 20px; font-weight: 800; color: var(--text-dark); }
        .stat-card.full .stat-title { color: #d1fae5; margin-bottom: 0; }
        .stat-card.full .stat-value { color: white; font-size: 24px; }
        .text-red { color: var(--danger) !important; }

        /* Filters & Search */
        .filter-section { padding: 0 15px; margin-bottom: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .search-container { grid-column: span 2; position: relative; }
        .search-container i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .search-container input { width: 100%; padding: 12px 15px 12px 38px; border-radius: 12px; border: 1px solid #e5e7eb; outline: none; font-size: 13px; font-family: inherit; background: var(--white); color: var(--text-dark); }
        .filter-select { background: var(--white); border: 1px solid #e5e7eb; padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--text-dark); outline: none; font-family: inherit; cursor: pointer; }

        /* Product List */
        .product-list { padding: 0 15px; display: flex; flex-direction: column; gap: 12px; }
        
        .stock-card { background: var(--white); border-radius: 14px; padding: 15px; box-shadow: var(--shadow); position: relative; overflow: hidden; border-left: 4px solid var(--success); display: flex; gap: 12px; align-items: center; border-top: 1px solid #f8fafc; border-right: 1px solid #f8fafc; border-bottom: 1px solid #f8fafc; }
        .stock-card.low-stock { border-left-color: var(--danger); background: #fef2f2; }
        .stock-card.high-value { border-left-color: var(--warning); }
        
        .stock-img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; background: #f8fafc; border: 1px solid #f1f5f9; flex-shrink: 0; }
        .stock-info { flex: 1; min-width: 0; }
        .stock-name { font-size: 14px; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; }
        .stock-brand { font-size: 10px; color: var(--primary); font-weight: 600; display: block; margin-bottom: 4px; }
        
        .stock-stats { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; }
        .qty-box { text-align: center; }
        .qty-num { font-size: 18px; font-weight: 800; color: var(--text-dark); line-height: 1; }
        .qty-unit { font-size: 10px; color: var(--text-light); font-weight: 600; text-transform: uppercase; }
        .low-stock .qty-num { color: var(--danger); }
        
        .val-box { text-align: right; }
        .val-text { font-size: 10px; color: var(--text-light); font-weight: 600; text-transform: uppercase; }
        .val-amt { font-size: 14px; font-weight: 800; color: var(--primary); }

        .btn-history { background: #f8fafc; border: 1px solid #e5e7eb; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--text-dark); cursor: pointer; transition: 0.2s; }
        .btn-history:active { background: #e5e7eb; }

        .load-more-btn { background: white; border: 1px solid #e5e7eb; color: var(--primary); font-weight: bold; padding: 10px; border-radius: 10px; text-align: center; margin: 10px 15px; cursor: pointer; display: none; box-shadow: var(--shadow); }

        /* History Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .btn-close { background: white; border: 1px solid #e5e7eb; width: 30px; height: 30px; border-radius: 50%; color: var(--text-light); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        
        .timeline { padding: 20px; overflow-y: auto; flex: 1; }
        .timeline-item { display: flex; gap: 15px; margin-bottom: 20px; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: 15px; top: 30px; bottom: -20px; width: 2px; background: #e5e7eb; }
        .timeline-item:last-child::before { display: none; }
        
        .tl-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; position: relative; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tl-icon.in { background: var(--success); }
        .tl-icon.out { background: var(--danger); }
        
        .tl-content { flex: 1; background: #f8fafc; padding: 10px 15px; border-radius: 12px; border: 1px solid #f1f5f9; }
        .tl-title { font-size: 12px; font-weight: 700; color: var(--text-dark); display: flex; justify-content: space-between; }
        .tl-date { font-size: 10px; color: var(--text-light); margin-top: 3px; font-weight: 500; }

        /* Print Specific CSS (Landscape A4 multi-page fix) */
        @media print {
            @page { size: A4 portrait; margin: 8mm; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .no-print { display: none !important; }
            #printAreaHolder { display: block !important; }
            #printAreaHolder table { width: 100% !important; border-collapse: collapse !important; }
            #printAreaHolder thead { display: table-header-group !important; }
            #printAreaHolder tfoot { display: table-row-group !important; }
            #printAreaHolder tr { page-break-inside: avoid !important; break-inside: avoid !important; }
            #printAreaHolder th, #printAreaHolder td { border: 1px solid #000000 !important; padding: 5px 6px !important; font-size: 10px !important; color: black !important; }
            #printAreaHolder th { background: #f1f5f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-signatures { page-break-inside: avoid !important; margin-top: 30px; display: flex; justify-content: space-between; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="app-header no-print" id="header-container">
        <div class="header-bg"></div>
        <div id="dynamicThemeContainer"></div>
        <div class="header-top">
            <div class="header-title">
                <a href="home.html"><i class="fas fa-arrow-left"></i></a>
                <span>Stock Analytics</span>
            </div>
            <div class="header-actions">
                <button onclick="exportToExcel()" class="btn-header" style="background:#16a34a;"><i class="fas fa-file-excel"></i> Excel</button>
                <button onclick="printStockReport()" class="btn-header"><i class="fas fa-print"></i> Print / PDF</button>
            </div>
        </div>
    </div>

    <div class="analytics-container no-print">
        <div class="stat-card full">
            <div>
                <div class="stat-title">Total Stock Asset Value</div>
                <div class="stat-value" id="valTotalAsset">৳0</div>
            </div>
            <i class="fas fa-chart-pie" style="font-size: 32px; opacity: 0.5;"></i>
        </div>
        <div class="stat-card">
            <div class="stat-title">Total Items</div>
            <div class="stat-value" id="valTotalItems">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title text-red"><i class="fas fa-exclamation-triangle"></i> Low Stock Alert</div>
            <div class="stat-value text-red" id="valLowStock">0</div>
        </div>
    </div>

    <!-- Filter Section -->
    <div class="filter-section no-print">
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search by product name, brand or barcode...">
        </div>
        <select id="filterSelect" class="filter-select" onchange="applyFilters()">
            <option value="all">All Stock Status (সব)</option>
            <option value="low">Low Stock Only (অ্যালার্ট স্টক)</option>
            <option value="out">Out of Stock (স্টক ০)</option>
            <option value="value">Highest Asset Value (সর্বোচ্চ সম্পদ)</option>
        </select>
        <select id="brandFilter" class="filter-select" onchange="applyFilters()">
            <option value="all">All Brands (সব ব্র্যান্ড)</option>
        </select>
    </div>

    <div id="loading" class="no-print" style="text-align: center; padding: 40px; color: var(--text-light); font-weight: 600; font-size: 13px;">
        <i class="fas fa-spinner fa-spin" style="font-size: 24px; color: var(--primary); margin-bottom: 10px;"></i><br>Analyzing Stock...
    </div>

    <div class="product-list no-print" id="stockList"></div>
    <div id="loadMoreBtn" class="load-more-btn no-print" onclick="loadMoreProducts()">Load More Products</div>

    <!-- Stock History Modal -->
    <div class="modal-overlay no-print" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 style="font-size: 14px; font-weight:700;">Stock History</h3>
                    <p id="historyProductName" style="font-size: 11px; color: var(--text-light); margin-top: 2px; font-weight: 600;"></p>
                </div>
                <button onclick="document.getElementById('historyModal').style.display='none'" class="btn-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="timeline" id="historyTimeline"></div>
        </div>
    </div>

    <!-- Container for Browser Direct Print -->
    <div id="printAreaHolder" style="display:none;"></div>

    <script type="module">
        import { rtdb, ref as rtdbRef, onValue as rtdbOnValue, get } from './firebase_config.js';
        import { query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        import { getShopBranding } from './invoice_kit.js';

        const SHOP_ID = localStorage.getItem('activeShopId');
        const SHOP_NAME = localStorage.getItem('activeShopName') || 'Poysha POS Store';

        let allProducts = [];
        let displayedProducts = [];
        let itemsPerPage = 20;
        let currentPage = 1;

        window.onload = () => {
            // Theme Sync
            rtdbOnValue(rtdbRef(rtdb, `global_settings/header_theme`), (snap) => {
                const themeCode = snap.exists() ? snap.val().code : null;
                if (themeCode && themeCode.trim() !== "") {
                    document.getElementById('dynamicThemeContainer').innerHTML = themeCode;
                    document.body.classList.add('has-theme');
                } else {
                    document.getElementById('dynamicThemeContainer').innerHTML = "";
                    document.body.classList.remove('has-theme');
                }
            });

            // Offline First Load
            const cachedProducts = localStorage.getItem(`stock_${SHOP_ID}`);
            if(cachedProducts) {
                allProducts = JSON.parse(cachedProducts);
                populateBrands();
                updateDashboard(allProducts);
                applyFilters();
            }

            // Realtime Sync
            const productsQuery = query(rtdbRef(rtdb, 'product_list'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(productsQuery, (snapshot) => {
                document.getElementById('loading').style.display = 'none';
                if (snapshot.exists()) {
                    allProducts = Object.entries(snapshot.val())
                        .map(([id, val]) => ({ id, ...val }))
                        .filter(p => !p.is_deleted);
                        
                    localStorage.setItem(`stock_${SHOP_ID}`, JSON.stringify(allProducts));
                    
                    populateBrands();
                    updateDashboard(allProducts);
                    applyFilters(); 
                } else {
                    document.getElementById('stockList').innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-light);"><i class="fas fa-box-open" style="font-size: 40px; color: #cbd5e1; margin-bottom: 10px;"></i><br>No stock data found.</div>';
                }
            });
        };

        function populateBrands() {
            const brandSelect = document.getElementById('brandFilter');
            const currentSelected = brandSelect.value;
            brandSelect.innerHTML = '<option value="all">All Brands (সব ব্র্যান্ড)</option>';
            const brands = new Set();
            allProducts.forEach(p => { if (p.brand && p.brand.trim() !== '') brands.add(p.brand.trim()); });
            Array.from(brands).sort().forEach(b => {
                brandSelect.innerHTML += `<option value="${b}">${b}</option>`;
            });
            brandSelect.value = currentSelected;
        }

        function updateDashboard(data) {
            let totalValue = 0;
            let lowStockCount = 0;

            data.forEach(p => {
                totalValue += (Number(p.stock || 0) * Number(p.buy_price || 0));
                if(Number(p.stock || 0) <= Number(p.alert_qty || 5)) lowStockCount++;
            });

            document.getElementById('valTotalAsset').innerText = `৳${totalValue.toLocaleString()}`;
            document.getElementById('valTotalItems').innerText = data.length.toLocaleString();
            document.getElementById('valLowStock').innerText = lowStockCount;
        }

        window.applyFilters = () => {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            const filterType = document.getElementById('filterSelect').value;
            const selectedBrand = document.getElementById('brandFilter').value;

            let filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(term) || 
                (p.brand && p.brand.toLowerCase().includes(term)) || 
                (p.barcode && p.barcode.toString().includes(term))
            );

            if (selectedBrand !== 'all') {
                filtered = filtered.filter(p => p.brand && p.brand.trim() === selectedBrand);
            }

            if(filterType === 'low') {
                filtered = filtered.filter(p => Number(p.stock || 0) <= Number(p.alert_qty || 5));
            } else if(filterType === 'out') {
                filtered = filtered.filter(p => Number(p.stock || 0) <= 0);
            } else if(filterType === 'value') {
                filtered.sort((a, b) => (Number(b.stock || 0) * Number(b.buy_price || 0)) - (Number(a.stock || 0) * Number(a.buy_price || 0)));
            } else {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }

            initPagination(filtered);
        };

        document.getElementById('searchInput').addEventListener('input', applyFilters);

        function initPagination(products) {
            currentPage = 1;
            displayedProducts = products;
            document.getElementById('stockList').innerHTML = '';
            
            if(displayedProducts.length === 0) {
                document.getElementById('stockList').innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-light); font-weight: 600;">No items match your search.</div>';
                document.getElementById('loadMoreBtn').style.display = 'none';
                return;
            }
            
            renderStock(displayedProducts.slice(0, itemsPerPage));
            
            if(displayedProducts.length > itemsPerPage) {
                document.getElementById('loadMoreBtn').style.display = 'block';
            } else {
                document.getElementById('loadMoreBtn').style.display = 'none';
            }
        }

        window.loadMoreProducts = () => {
            const startIndex = currentPage * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const nextBatch = displayedProducts.slice(startIndex, endIndex);
            
            renderStock(nextBatch, true); 
            currentPage++;
            
            if(endIndex >= displayedProducts.length) {
                document.getElementById('loadMoreBtn').style.display = 'none';
            }
        };

        function renderStock(products, append = false) {
            const listEl = document.getElementById('stockList');
            if(!append) listEl.innerHTML = '';
            
            products.forEach((p) => {
                const imgUrl = p.image || 'https://via.placeholder.com/100?text=Item';
                const isLowStock = Number(p.stock || 0) <= Number(p.alert_qty || 5);
                const assetValue = Number(p.stock || 0) * Number(p.buy_price || 0);
                const isHighValue = assetValue > 10000; 
                
                let cardClass = 'stock-card';
                if(isLowStock) cardClass += ' low-stock';
                else if(isHighValue) cardClass += ' high-value';

                const html = `
                <div class="${cardClass}">
                    <img src="${imgUrl}" class="stock-img">
                    <div class="stock-info">
                        <div class="stock-name">
                            <span>${p.name} ${isLowStock ? '<i class="fas fa-exclamation-circle text-red ml-1"></i>' : ''}</span>
                        </div>
                        ${p.brand ? `<span class="stock-brand"><i class="fas fa-tag"></i> ${p.brand}</span>` : ''}
                        
                        <div class="stock-stats">
                            <div class="qty-box">
                                <div class="qty-num">${p.stock || 0}</div>
                                <div class="qty-unit">${p.unit || 'pcs'}</div>
                            </div>
                            
                            <div style="text-align: center;">
                                <button onclick="fetchHistory('${p.id}', '${p.name.replace(/'/g, "\\'")}')" class="btn-history"><i class="fas fa-history"></i> History</button>
                            </div>

                            <div class="val-box">
                                <div class="val-text">Asset Value</div>
                                <div class="val-amt">৳${assetValue.toLocaleString()}</div>
                            </div>
                        </div>
                    </div>
                </div>`;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        }

        // --- STOCK HISTORY TIMELINE ---
        window.fetchHistory = async (productId, productName) => {
            const modal = document.getElementById('historyModal');
            const timeline = document.getElementById('historyTimeline');
            document.getElementById('historyProductName').innerText = productName;
            
            timeline.innerHTML = '<div style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin text-primary"></i> Loading logs...</div>';
            modal.style.display = 'flex';

            try {
                const [purchaseSnap, salesSnap, stockSnap] = await Promise.all([
                    get(query(rtdbRef(rtdb, 'purchase_history'), orderByChild('shop_id'), equalTo(SHOP_ID))),
                    get(query(rtdbRef(rtdb, 'sales_history'), orderByChild('shop_id'), equalTo(SHOP_ID))),
                    get(query(rtdbRef(rtdb, 'stock_history'), orderByChild('shop_id'), equalTo(SHOP_ID)))
                ]);

                let historyLogs = [];

                if(purchaseSnap.exists()) {
                    Object.values(purchaseSnap.val()).forEach(purchase => {
                        const item = purchase.items?.find(i => i.id === productId);
                        if(item) {
                            historyLogs.push({
                                type: 'in', date: purchase.created_at || new Date(purchase.date).getTime(),
                                qty: item.qty, rate: item.purchaseRate, ref: `Purchase: ${purchase.challan_no || 'N/A'}`
                            });
                        }
                    });
                }

                if(salesSnap.exists()) {
                    Object.values(salesSnap.val()).forEach(sale => {
                        const item = sale.items?.find(i => i.id === productId);
                        if(item) {
                            historyLogs.push({
                                type: 'out', date: sale.created_at || new Date(sale.date).getTime(),
                                qty: item.qty, rate: item.sellRate, ref: `Sale: ${sale.invoice_no || 'N/A'}`
                            });
                        }
                    });
                }

                if(stockSnap.exists()) {
                    Object.values(stockSnap.val()).forEach(log => {
                        if (log.product_id === productId) {
                            const isOut = log.action && log.action.toLowerCase().includes("reduce");
                            historyLogs.push({
                                type: isOut ? 'out' : 'in', date: log.date,
                                qty: log.qty, rate: "-", ref: `${log.action}`
                            });
                        }
                    });
                }

                historyLogs.sort((a, b) => b.date - a.date);

                if(historyLogs.length === 0) {
                    timeline.innerHTML = '<div style="text-align:center; color:#9ca3af; font-size:12px; margin-top:20px;">No transaction history found for this item.</div>';
                    return;
                }

                timeline.innerHTML = '';
                historyLogs.forEach(log => {
                    const isIn = log.type === 'in';
                    const d = new Date(log.date);
                    const rateDisplay = log.rate === "-" ? "" : `৳${log.rate}/pc`;
                    
                    timeline.innerHTML += `
                        <div class="timeline-item">
                            <div class="tl-icon ${isIn ? 'in' : 'out'}"><i class="fas ${isIn ? 'fa-arrow-down' : 'fa-arrow-up'}"></i></div>
                            <div class="tl-content">
                                <div class="tl-title">
                                    <span style="color: ${isIn ? 'var(--success)' : 'var(--danger)'}">${isIn ? 'Stock IN' : 'Stock OUT'} (+${log.qty})</span>
                                    <span>${rateDisplay}</span>
                                </div>
                                <div class="tl-date">${log.ref} • ${d.toLocaleDateString('en-GB')} ${d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                            </div>
                        </div>
                    `;
                });

            } catch(e) {
                timeline.innerHTML = '<div style="text-align:center; color:red; font-size:12px;">Error loading history.</div>';
            }
        };

        // --- DIRECT PRINT (STOCK REPORT) ---
        window.printStockReport = async () => {
            if(displayedProducts.length === 0) return alert("প্রিন্ট করার জন্য কোনো পণ্য পাওয়া যায়নি!");
            const shop = await getShopBranding(SHOP_ID);
            const printArea = document.getElementById('printAreaHolder');

            let rowsHtml = '';
            let sumQty = 0, sumAssetVal = 0;

            displayedProducts.forEach((p, idx) => {
                const stockQty = Number(p.stock || 0);
                const buyPrice = Number(p.buy_price || 0);
                const sellPrice = Number(p.sell_price || 0);
                const assetVal = stockQty * buyPrice;

                sumQty += stockQty;
                sumAssetVal += assetVal;

                const isLow = stockQty <= Number(p.alert_qty || 5);

                rowsHtml += `
                    <tr>
                        <td style="text-align:center;">${idx + 1}</td>
                        <td><b>${p.name}</b> ${isLow ? '<span style="color:red;">(Low)</span>' : ''}</td>
                        <td>${p.brand || '—'}</td>
                        <td style="font-family:monospace; text-align:center;">${p.barcode || '—'}</td>
                        <td style="text-align:center; font-weight:bold; ${isLow ? 'color:red;' : ''}">${stockQty} ${p.unit || 'pcs'}</td>
                        <td style="text-align:right;">৳${buyPrice.toLocaleString()}</td>
                        <td style="text-align:right;">৳${sellPrice.toLocaleString()}</td>
                        <td style="text-align:right; font-weight:bold;">৳${assetVal.toLocaleString()}</td>
                    </tr>
                `;
            });

            printArea.innerHTML = `
                <div style="text-align: center; margin-bottom: 15px; font-family:'Hind Siliguri',sans-serif;">
                    ${shop.logo ? `<img src="${shop.logo}" style="width:55px; height:55px; border-radius:10px; object-fit:cover; margin-bottom:5px;">` : ''}
                    <h2 style="font-size: 20px; margin: 0; color:#0f172a;">${shop.name}</h2>
                    <p style="font-size: 11px; color: #64748b; margin: 2px 0;">${shop.address || ''}</p>
                    <div style="display:inline-block; background:#10b981; color:white; font-size:12px; font-weight:700; padding:2px 12px; border-radius:12px; margin-top:4px;">ইনভেন্টরি ও স্টক বিবরণী (Stock Report)</div>
                    <p style="font-size: 11px; color: #334155; margin-top: 4px; font-weight:600;">তারিখ: <b>${new Date().toLocaleDateString('en-GB')}</b> | মোট পণ্য: <b>${displayedProducts.length}</b></p>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th style="width:30px;">#</th>
                            <th>পণ্যের নাম</th>
                            <th>ব্র্যান্ড</th>
                            <th style="width:80px; text-align:center;">বারকোড</th>
                            <th style="width:65px; text-align:center;">বর্তমান স্টক</th>
                            <th style="text-align:right; width:65px;">ক্রয়মূল্য</th>
                            <th style="text-align:right; width:65px;">বিক্রয়মূল্য</th>
                            <th style="text-align:right; width:80px;">সম্পদ মূল্য (Asset)</th>
                        </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4" style="text-align:right; font-weight:bold;">সর্বমোট (Total):</td>
                            <td style="text-align:center; font-weight:bold;">${sumQty}</td>
                            <td colspan="2"></td>
                            <td style="text-align:right; font-weight:bold; color:#10b981;">৳${sumAssetVal.toLocaleString()}</td>
                        </tr>
                    </tfoot>
                </table>

                <div class="print-signatures">
                    <div>স্টোরকিপার স্বাক্ষর: ____________________</div>
                    <div>হিসাবরক্ষক স্বাক্ষর: ____________________</div>
                    <div>কর্তৃপক্ষের স্বাক্ষর: ____________________</div>
                </div>
            `;

            window.print();
        };

        // --- EXPORT TO EXCEL ---
        window.exportToExcel = () => {
            if(displayedProducts.length === 0) return alert("এক্সেলে ডাউনলোড করার মতো কোনো পণ্য নেই!");
            const filename = `Stock_Report_${new Date().toISOString().split('T')[0]}.xls`;

            let rowsHtml = '';
            let sumQty = 0, sumAssetVal = 0;

            displayedProducts.forEach((p, idx) => {
                const stockQty = Number(p.stock || 0);
                const buyPrice = Number(p.buy_price || 0);
                const sellPrice = Number(p.sell_price || 0);
                const assetVal = stockQty * buyPrice;

                sumQty += stockQty;
                sumAssetVal += assetVal;

                rowsHtml += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${p.name}</td>
                        <td>${p.brand || '—'}</td>
                        <td>${p.barcode || '—'}</td>
                        <td>${stockQty}</td>
                        <td>${p.unit || 'pcs'}</td>
                        <td>${buyPrice}</td>
                        <td>${sellPrice}</td>
                        <td>${assetVal}</td>
                        <td>${stockQty <= Number(p.alert_qty || 5) ? 'Low Stock' : 'In Stock'}</td>
                    </tr>
                `;
            });

            const excelTemplate = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"></head>
                <body>
                    <h2 style="text-align:center;">${SHOP_NAME}</h2>
                    <p style="text-align:center;">ইনভেন্টরি ও স্টক বিবরণী (${new Date().toLocaleDateString('en-GB')})</p>
                    <table border="1">
                        <thead>
                            <tr style="background:#fef3c7; font-weight:bold;">
                                <th>SL</th>
                                <th>Product Name</th>
                                <th>Brand</th>
                                <th>Barcode / SKU</th>
                                <th>Current Stock</th>
                                <th>Unit</th>
                                <th>Buy Price (Tk)</th>
                                <th>Sell Price (Tk)</th>
                                <th>Asset Value (Tk)</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                        <tfoot>
                            <tr style="font-weight:bold; background:#f1f5f9;">
                                <td colspan="4" align="right">Total:</td>
                                <td>${sumQty}</td>
                                <td colspan="3"></td>
                                <td>${sumAssetVal}</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </body>
                </html>
            `;

            const blob = new Blob(['\ufeff' + excelTemplate], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>
</html>
