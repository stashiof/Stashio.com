<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <title>Estimate & Quotation - Poysha POS</title>
    
    <meta name="theme-color" content="#f59e0b">
    <script>
        const activeShopId = localStorage.getItem('activeShopId');
        if (!activeShopId) window.location.replace("dashboard.html");
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root { 
            --primary: #f59e0b; --secondary: #d97706; --bg-color: #f3f4f6; 
            --white: #ffffff; --text-dark: #1f2937; --text-light: #6b7280; 
            --danger: #ef4444; --success: #10b981; --shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding-bottom: 30px; position: relative; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Header */
        .app-header { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); 
            padding: 20px 20px 30px 20px; color: white; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; 
            position: sticky; top: 0; z-index: 50; box-shadow: 0 5px 15px rgba(245, 158, 11, 0.2); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .header-title { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
        .header-title a { color: white; text-decoration: none; }
        .btn-header { background: rgba(255,255,255,0.2); border: none; padding: 8px 12px; border-radius: 10px; color: white; font-size: 12px; font-weight: 600; cursor: pointer; backdrop-filter: blur(5px); display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-header:active { transform: scale(0.95); }
        
        /* Search Box */
        .search-container { margin: -15px 15px 15px 15px; display: flex; gap: 10px; position: relative; z-index: 60; }
        .search-box { flex: 1; position: relative; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .search-box input { width: 100%; padding: 14px 15px 14px 40px; border-radius: 14px; border: none; outline: none; box-shadow: var(--shadow); font-size: 13px; font-family: inherit; background: var(--white); color: var(--text-dark); }
        .btn-scan { background: var(--text-dark); color: white; width: 50px; border-radius: 14px; border: none; box-shadow: var(--shadow); cursor: pointer; font-size: 20px; transition: 0.2s; }
        .btn-scan:active { transform: scale(0.95); }

        /* Product Grid */
        .product-list { padding: 0 15px; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; border-bottom: 2px dashed #e5e7eb; padding-bottom: 15px; }
        .product-card { background: var(--white); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); border: 2px solid transparent; transition: 0.2s; cursor: pointer; }
        .product-card:active { transform: scale(0.98); }
        .product-card.in-cart { border-color: var(--primary); background: #fef3c7; }
        
        .product-img { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; background: #f8fafc; border: 1px solid #f1f5f9; flex-shrink: 0; }
        .product-info { flex: 1; min-width: 0; }
        .product-name { font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-brand { font-size: 10px; color: var(--secondary); font-weight: 600; display: block; margin-bottom: 2px; }
        .product-meta { display: flex; gap: 8px; font-size: 10.5px; }
        .badge-stock { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; color: var(--text-light); font-weight: 600; }
        .badge-price { background: #ffedd5; padding: 2px 6px; border-radius: 6px; color: var(--secondary); font-weight: 700; }
        
        .cart-toggle-btn { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: #9ca3af; font-size: 12px; transition: 0.2s; }
        .product-card.in-cart .cart-toggle-btn { background: var(--primary); color: white; }

        /* Estimate Cart Area */
        .cart-container { padding: 0 15px; display: flex; flex-direction: column; gap: 10px; }
        .cart-item { background: white; padding: 14px; border-radius: 14px; box-shadow: var(--shadow); border: 1px solid #f8fafc; }
        .item-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 10px; font-size: 13.5px; color: var(--text-dark); }
        .item-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .input-box { display: flex; flex-direction: column; }
        .input-box label { font-size: 10px; color: var(--text-light); font-weight: 700; margin-bottom: 2px; text-transform: uppercase; }
        .input-box input { padding: 8px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; font-weight: bold; width: 100%; text-align: center; outline: none; font-family: inherit; }
        .input-box input:focus { border-color: var(--primary); }
        .input-box input.buy { color: var(--danger); border-color: #fca5a5; background: #fef2f2; }
        .input-box input.sell { color: var(--success); border-color: #86efac; background: #f0fdf4; }
        
        /* Summary Card */
        .summary-card { background: white; margin: 15px; padding: 18px; border-radius: 16px; box-shadow: var(--shadow); border: 2px solid var(--primary); }
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .summary-row.profit { font-size: 16px; font-weight: 800; color: var(--success); border-top: 2px dashed #e5e7eb; padding-top: 10px; margin-top: 10px; }
        
        /* Action Grid */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 15px 30px 15px; }
        .btn-action { padding: 14px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-action:active { transform: scale(0.98); }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .btn-close { background: white; border: 1px solid #e5e7eb; width: 30px; height: 30px; border-radius: 50%; color: var(--text-light); cursor: pointer; }
        
        .saved-list { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .saved-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; background: #f8fafc; }
        .sc-title { font-size: 14px; font-weight: 800; color: var(--text-dark); margin-bottom: 4px; }
        .sc-date { font-size: 11px; color: var(--text-light); margin-bottom: 10px; }
        .sc-actions { display: flex; gap: 8px; }
        .sc-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

        #scannerModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #reader { width: 100%; max-width: 320px; border-radius: 20px; overflow: hidden; border: 3px solid var(--primary); }
        .btn-close-scanner { margin-top: 25px; background: white; color: var(--danger); border: none; padding: 10px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; }

        /* Clean Print Styles for Quotation */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .no-print { display: none !important; }
            #printAreaHolder { display: block !important; }
            #printAreaHolder table { width: 100% !important; border-collapse: collapse !important; }
            #printAreaHolder thead { display: table-header-group !important; }
            #printAreaHolder tfoot { display: table-row-group !important; }
            #printAreaHolder tr { page-break-inside: avoid !important; break-inside: avoid !important; }
            #printAreaHolder th, #printAreaHolder td { border: 1px solid #000000 !important; padding: 6px 8px !important; font-size: 11px !important; color: black !important; }
            #printAreaHolder th { background: #f8fafc !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-signatures { page-break-inside: avoid !important; margin-top: 35px; display: flex; justify-content: space-between; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="app-header no-print">
        <div class="header-title">
            <a href="home.html"><i class="fas fa-arrow-left"></i></a>
            <span>Estimate & Quotation</span>
        </div>
        <button onclick="openSavedModal()" class="btn-header"><i class="fas fa-list-alt"></i> Saved List</button>
    </div>

    <!-- Search / Barcode -->
    <div class="search-container no-print">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search by name, brand or scan barcode...">
        </div>
        <button onclick="startScanner()" class="btn-scan"><i class="fas fa-barcode"></i></button>
    </div>

    <div id="loading" class="no-print" style="text-align: center; padding: 15px; color: var(--text-light); font-size: 12px;">
        <i class="fas fa-spinner fa-spin text-primary" style="font-size: 20px; margin-bottom: 6px;"></i><br>Loading Inventory...
    </div>

    <!-- Product Picker -->
    <div class="product-list no-print" id="productGrid"></div>

    <!-- Quotation Items Heading -->
    <div style="padding: 0 15px; margin-bottom: 8px; font-weight: 800; color: var(--primary); font-size: 12px; display: flex; justify-content: space-between; align-items: center;" class="no-print">
        <span><i class="fas fa-clipboard-list"></i> ITEMS IN QUOTATION:</span>
        <span id="currentClientLabel" style="color: var(--text-dark); background: #fef3c7; padding: 2px 8px; border-radius: 6px; font-size: 10px; display: none;"></span>
    </div>
    
    <!-- Items Container -->
    <div class="cart-container no-print" id="cartList">
        <div style="text-align: center; color: #9ca3af; padding: 25px 0; font-size: 12px; border: 1px dashed #cbd5e1; border-radius: 12px;">
            <i class="fas fa-hand-pointer" style="font-size:20px; margin-bottom:6px; opacity:0.6;"></i><br>
            উপরে থাকা পণ্য তালিকায় ক্লিক করে এখানে আইটেম যুক্ত করুন।
        </div>
    </div>

    <!-- Summary Box -->
    <div class="summary-card no-print">
        <div class="summary-row"><span>Total Market Cost (Buy):</span> <span id="sumBuy" style="color: var(--danger);">৳0</span></div>
        <div class="summary-row"><span>Total Client Bill (Sell):</span> <span id="sumSell" style="color: var(--text-dark);">৳0</span></div>
        <div class="summary-row profit"><span>Estimated Profit:</span> <span id="sumProfit">৳0</span></div>
    </div>

    <!-- Action Buttons -->
    <div class="action-grid no-print">
        <button class="btn-action" style="background: var(--success); color: white; grid-column: span 2;" onclick="saveQuotation()"><i class="fas fa-save"></i> Save / Update Quotation</button>
        <button class="btn-action" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white;" onclick="openClientDetailsModal()"><i class="fas fa-print"></i> Print / PDF Quote</button>
        <button class="btn-action" style="background: #16a34a; color: white;" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Export Excel</button>
        <button class="btn-action" style="background: linear-gradient(135deg, #f59e0b, #ea580c); color: white; grid-column: span 2;" onclick="convertToSale()"><i class="fas fa-cash-register"></i> Convert to Sale (এই দামে বিক্রি করুন)</button>
        <button class="btn-action" style="background: #fee2e2; color: var(--danger); grid-column: span 2;" onclick="clearEstimate()"><i class="fas fa-trash-alt"></i> Clear All</button>
    </div>

    <!-- Client Details Modal (For PDF / Print) -->
    <div class="modal-overlay no-print" id="clientDetailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0; font-size: 15px; font-weight:800;" id="clientModalTitle">Quotation Details</h3>
                <button onclick="closeClientDetailsModal()" class="btn-close"><i class="fas fa-times"></i></button>
            </div>
            <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px;">
                <div class="input-box" style="text-align:left;">
                    <label style="text-align:left;">Client / Company Name *</label>
                    <input type="text" id="qClientName" placeholder="e.g. Rahim Traders" style="text-align:left; padding:10px;">
                </div>
                <div class="input-box" style="text-align:left;" id="qPhoneBox">
                    <label style="text-align:left;">Client Phone (Optional)</label>
                    <input type="text" id="qClientPhone" placeholder="01XXXXXXXXX" style="text-align:left; padding:10px;">
                </div>
                <div class="input-box" style="text-align:left;" id="qValidUntilBox">
                    <label style="text-align:left;">Valid Until</label>
                    <input type="date" id="qValidUntil" style="text-align:left; padding:10px;">
                </div>
                <button class="btn-action" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; margin-top:5px;" onclick="generateQuotationPrint()" id="clientModalActionBtn"><i class="fas fa-print"></i> Print / Save PDF</button>
            </div>
        </div>
    </div>

    <!-- Saved Quotations Modal -->
    <div class="modal-overlay no-print" id="savedModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0; font-size: 15px; font-weight:800;"><i class="fas fa-folder-open text-primary"></i> Saved Quotations</h3>
                <button onclick="closeSavedModal()" class="btn-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="saved-list" id="savedQuotesList">
                <div style="text-align: center; padding: 25px; color: #9ca3af;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
            </div>
        </div>
    </div>

    <!-- Barcode Scanner Modal -->
    <div id="scannerModal">
        <div id="reader"></div>
        <button onclick="stopScanner()" class="btn-close-scanner">Close Camera</button>
    </div>

    <!-- Printable Quotation Container -->
    <div id="printAreaHolder" style="display:none;"></div>

    <script type="module">
        import { rtdb, ref as rtdbRef, get, onValue as rtdbOnValue, push, update, remove } from './firebase_config.js';
        import { query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        import { getShopBranding, numberToWordsBDT } from './invoice_kit.js';

        const SHOP_ID = localStorage.getItem('activeShopId');
        const SHOP_NAME = localStorage.getItem('activeShopName') || "Poysha POS Store";
        
        let allProducts = [];
        let estimateCart = {};
        let html5QrcodeScanner = null;

        let editingQuoteId = null;
        let editingClientName = '';
        let allSavedQuotes = [];
        let pendingSaveAfterModal = false;

        function safeKey(name) { return name.trim().replace(/[.#$\[\]\/]/g, '_'); }

        window.onload = () => {
            // Load Products
            const productsQuery = query(rtdbRef(rtdb, 'product_list'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(productsQuery, (snap) => {
                document.getElementById('loading').style.display = 'none';
                if(snap.exists()) {
                    allProducts = Object.entries(snap.val())
                        .map(([id, val]) => ({ id, ...val }))
                        .filter(p => !p.is_deleted);
                    applySearch(''); 
                } else {
                    document.getElementById('productGrid').innerHTML = '<div style="text-align:center; padding: 20px; color:#9ca3af;">No products found in inventory.</div>';
                }
            });

            // Load Saved Quotations
            const quotesQuery = query(rtdbRef(rtdb, 'quotations'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(quotesQuery, (snap) => {
                if(snap.exists()) {
                    allSavedQuotes = Object.entries(snap.val())
                        .map(([id, val]) => ({ id, ...val }))
                        .reverse();
                } else {
                    allSavedQuotes = [];
                }
                renderSavedQuotesList();

                const params = new URLSearchParams(window.location.search);
                const loadCustomerName = params.get('loadCustomer');
                if (loadCustomerName && !editingQuoteId) {
                    const match = allSavedQuotes.find(q => q.client_name === loadCustomerName);
                    if (match) loadSavedQuotation(match.id);
                    else {
                        editingClientName = loadCustomerName;
                        document.getElementById('currentClientLabel').innerText = `New Quote For: ${loadCustomerName}`;
                        document.getElementById('currentClientLabel').style.display = 'inline-block';
                    }
                }
            });
        };

        function renderProductGrid(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if(products.length === 0) {
                grid.innerHTML = '<div style="text-align:center; padding: 20px; color:#9ca3af; font-size:12px;">No matching products.</div>';
                return;
            }

            products.forEach(p => {
                const img = p.image || 'https://via.placeholder.com/100?text=Item';
                const isInCart = estimateCart[p.id] !== undefined;
                
                const html = `
                <div class="product-card ${isInCart ? 'in-cart' : ''}" onclick="toggleEstimateItem('${p.id}')">
                    <img src="${img}" class="product-img">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        ${p.brand ? `<span class="product-brand"><i class="fas fa-tag"></i> ${p.brand}</span>` : ''}
                        <div class="product-meta">
                            <span class="badge-stock">Stock: ${p.stock || 0}</span>
                            <span class="badge-price">Rate: ৳${p.sell_price || 0}</span>
                        </div>
                    </div>
                    <div class="cart-toggle-btn">
                        <i class="fas ${isInCart ? 'fa-check' : 'fa-plus'}"></i>
                    </div>
                </div>`;
                grid.insertAdjacentHTML('beforeend', html);
            });
        }

        window.toggleEstimateItem = (id) => {
            if(estimateCart[id]) {
                delete estimateCart[id];
            } else {
                const p = allProducts.find(x => x.id === id);
                estimateCart[id] = { ...p, estQty: 1, estBuy: Number(p.buy_price || 0), estSell: Number(p.sell_price || 0) };
            }
            
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            applySearch(term);
            renderCart();
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            applySearch(e.target.value.toLowerCase().trim());
        });

        function applySearch(term) {
            if(term === '') {
                renderProductGrid(allProducts.slice(0, 30)); 
            } else {
                const filtered = allProducts.filter(p => 
                    p.name.toLowerCase().includes(term) || 
                    (p.brand && p.brand.toLowerCase().includes(term)) || 
                    (p.barcode && p.barcode.toString().toLowerCase().includes(term))
                );
                renderProductGrid(filtered.slice(0, 30));
            }
        }

        window.updateField = (id, field, value) => {
            estimateCart[id][field] = Number(value) || 0;
            calculateSummary();
        };

        window.removeItem = (id) => { 
            delete estimateCart[id]; 
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            applySearch(term); 
            renderCart(); 
        };

        function renderCart() {
            const list = document.getElementById('cartList');
            list.innerHTML = '';
            
            if(Object.keys(estimateCart).length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 25px 0; font-size: 12px; border: 1px dashed #cbd5e1; border-radius: 12px;"><i class="fas fa-hand-pointer" style="font-size:20px; margin-bottom:6px; opacity:0.6;"></i><br>উপরে থাকা পণ্য তালিকায় ক্লিক করে এখানে আইটেম যুক্ত করুন।</div>';
                calculateSummary();
                return;
            }

            Object.values(estimateCart).forEach(item => {
                list.innerHTML += `
                <div class="cart-item">
                    <div class="item-header">
                        <span>${item.name} ${item.brand ? `<small style="color:#6b7280; font-weight:normal;">(${item.brand})</small>` : ''}</span>
                        <button onclick="removeItem('${item.id}')" style="background:none; border:none; color:var(--danger); cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>
                    <div class="item-grid">
                        <div class="input-box">
                            <label>Required Qty</label>
                            <input type="number" value="${item.estQty}" onchange="updateField('${item.id}', 'estQty', this.value)">
                        </div>
                        <div class="input-box">
                            <label>Market Buy (৳)</label>
                            <input type="number" class="buy" value="${item.estBuy}" onchange="updateField('${item.id}', 'estBuy', this.value)">
                        </div>
                        <div class="input-box">
                            <label>Client Bill (৳)</label>
                            <input type="number" class="sell" value="${item.estSell}" onchange="updateField('${item.id}', 'estSell', this.value)">
                        </div>
                    </div>
                </div>`;
            });
            calculateSummary();
        }

        function calculateSummary() {
            let totalBuy = 0, totalSell = 0;
            Object.values(estimateCart).forEach(item => {
                totalBuy += (item.estBuy * item.estQty);
                totalSell += (item.estSell * item.estQty);
            });
            const profit = totalSell - totalBuy;

            document.getElementById('sumBuy').innerText = `৳${totalBuy.toLocaleString()}`;
            document.getElementById('sumSell').innerText = `৳${totalSell.toLocaleString()}`;
            document.getElementById('sumProfit').innerText = `৳${profit.toLocaleString()}`;

            return { totalBuy, totalSell, profit };
        }

        // --- SAVE / UPDATE LOGIC ---
        window.saveQuotation = async () => {
            if(Object.keys(estimateCart).length === 0) return alert("Cart is empty! Add items first.");

            let clientName = editingClientName;
            if(!clientName) {
                pendingSaveAfterModal = true;
                openClientDetailsModal(true);
                return;
            }
            await performSaveQuotation(clientName);
        };

        async function performSaveQuotation(clientName, silent = false) {
            let totalBuy = 0, totalSell = 0;
            const itemsToSave = [];
            const priceUpdates = {};

            Object.values(estimateCart).forEach(item => {
                totalBuy += (item.estBuy * item.estQty);
                totalSell += (item.estSell * item.estQty);
                itemsToSave.push({ id: item.id, name: item.name, brand: item.brand||"", estQty: item.estQty, estBuy: item.estBuy, estSell: item.estSell, unit: item.unit||"Pcs" });
                priceUpdates[`customer_prices/${SHOP_ID}/${safeKey(clientName)}/${item.id}`] = item.estSell;
            });

            const quoteData = {
                shop_id: SHOP_ID,
                client_name: clientName,
                items: itemsToSave,
                total_buy: totalBuy,
                total_sell: totalSell,
                profit: totalSell - totalBuy,
                updated_at: Date.now()
            };

            try {
                if(editingQuoteId) {
                    await update(rtdbRef(rtdb, `quotations/${editingQuoteId}`), quoteData);
                } else {
                    quoteData.created_at = Date.now();
                    const newRef = await push(rtdbRef(rtdb, 'quotations'), quoteData);
                    editingQuoteId = newRef.key;
                    editingClientName = clientName;
                    document.getElementById('currentClientLabel').innerText = `Editing: ${clientName}`;
                    document.getElementById('currentClientLabel').style.display = 'inline-block';
                }

                await update(rtdbRef(rtdb), {
                    [`customer_quotations/${SHOP_ID}/${safeKey(clientName)}`]: {
                        quote_id: editingQuoteId, customer_name: clientName,
                        items: itemsToSave, total: totalSell, date: Date.now()
                    },
                    ...priceUpdates
                });

                if (!silent) {
                    alert(`Quotation ${editingQuoteId ? 'updated' : 'saved'} successfully! এই দামগুলো "${clientName}" নামে সেলে স্বয়ংক্রিয়ভাবে বসে যাবে।`);
                }
            } catch(e) { alert("Error saving quotation: " + e.message); }
        }

        // --- SAVED MODAL LOGIC ---
        window.openSavedModal = () => { document.getElementById('savedModal').style.display = 'flex'; };
        window.closeSavedModal = () => { document.getElementById('savedModal').style.display = 'none'; };

        function renderSavedQuotesList() {
            const list = document.getElementById('savedQuotesList');
            list.innerHTML = '';
            
            if(allSavedQuotes.length === 0) {
                list.innerHTML = '<div style="text-align: center; padding: 25px; color: #9ca3af; font-size:12px;">No saved quotations found.</div>';
                return;
            }

            allSavedQuotes.forEach(q => {
                const dateStr = new Date(q.created_at || Date.now()).toLocaleDateString('en-GB');
                list.innerHTML += `
                <div class="saved-card">
                    <div class="sc-title">${q.client_name}</div>
                    <div class="sc-date">Date: ${dateStr} • Bill: <b>৳${Number(q.total_sell || 0).toLocaleString()}</b></div>
                    <div class="sc-actions">
                        <button onclick="loadSavedQuotation('${q.id}')" class="sc-btn" style="background:#e0e7ff; color:var(--primary);"><i class="fas fa-folder-open"></i> Load</button>
                        <button onclick="deleteQuotation('${q.id}')" class="sc-btn" style="background:#fee2e2; color:var(--danger); flex: 0.35;"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }

        window.loadSavedQuotation = (id) => {
            const q = allSavedQuotes.find(x => x.id === id);
            if(!q) return;

            estimateCart = {};
            (q.items || []).forEach(item => {
                estimateCart[item.id] = { ...item };
            });

            editingQuoteId = q.id;
            editingClientName = q.client_name;
            
            document.getElementById('currentClientLabel').innerText = `Editing: ${editingClientName}`;
            document.getElementById('currentClientLabel').style.display = 'inline-block';
            
            applySearch('');
            renderCart();
            closeSavedModal();
        };

        window.deleteQuotation = async (id) => {
            if(confirm("Are you sure you want to delete this saved quotation?")) {
                try {
                    await remove(rtdbRef(rtdb, `quotations/${id}`));
                    if(editingQuoteId === id) window.clearEstimate();
                } catch(e) { alert("Error deleting: " + e.message); }
            }
        };

        window.clearEstimate = () => {
            if(Object.keys(estimateCart).length > 0 && !confirm("Clear all items and start new?")) return;
            estimateCart = {};
            editingQuoteId = null;
            editingClientName = '';
            document.getElementById('currentClientLabel').style.display = 'none';
            document.getElementById('searchInput').value = '';
            applySearch('');
            renderCart();
        };

        // --- CONVERT TO SALE ---
        window.convertToSale = async () => {
            if(Object.keys(estimateCart).length === 0) return alert("Cart is empty! Add items first.");

            let clientName = editingClientName;
            if(!clientName) {
                clientName = prompt("কাস্টমারের নাম লিখুন:");
                if(!clientName || !clientName.trim()) return;
                clientName = clientName.trim();
            }

            await performSaveQuotation(clientName, true);
            window.location.href = `sell.html?prefillCustomer=${encodeURIComponent(clientName)}`;
        };

        // --- CLIENT DETAILS MODAL FOR PRINT ---
        window.openClientDetailsModal = (isSaveMode = false) => {
            if(Object.keys(estimateCart).length === 0) return alert("Please add items to estimate first!");
            document.getElementById('qClientName').value = editingClientName || '';
            const nextWeek = new Date(); nextWeek.setDate(nextWeek.getDate() + 7);
            document.getElementById('qValidUntil').value = nextWeek.toISOString().split('T')[0];

            document.getElementById('qPhoneBox').style.display = isSaveMode ? 'none' : 'block';
            document.getElementById('qValidUntilBox').style.display = isSaveMode ? 'none' : 'block';
            document.getElementById('clientModalTitle').innerText = isSaveMode ? 'Save Quotation As' : 'Quotation Details';
            document.getElementById('clientModalActionBtn').innerHTML = isSaveMode ? '<i class="fas fa-save"></i> Save Quotation' : '<i class="fas fa-print"></i> Print / Save PDF';

            document.getElementById('clientDetailsModal').style.display = 'flex';
        };
        window.closeClientDetailsModal = () => { document.getElementById('clientDetailsModal').style.display = 'none'; };

        // --- DIRECT CLEAN PRINT (QUOTATION) ---
        window.generateQuotationPrint = async () => {
            const clientName = document.getElementById('qClientName').value.trim();
            const clientPhone = document.getElementById('qClientPhone').value.trim();
            const validUntil = document.getElementById('qValidUntil').value;
            if(!clientName) return alert("Client/Customer name is required!");

            editingClientName = clientName;
            closeClientDetailsModal();

            if (pendingSaveAfterModal) {
                pendingSaveAfterModal = false;
                await performSaveQuotation(clientName);
                return;
            }

            const shop = await getShopBranding(SHOP_ID);
            const { totalSell } = calculateSummary();
            const printArea = document.getElementById('printAreaHolder');

            let rowsHtml = '';
            Object.values(estimateCart).forEach((it, idx) => {
                const itemTotal = it.estSell * it.estQty;
                rowsHtml += `
                    <tr>
                        <td style="text-align:center;">${idx + 1}</td>
                        <td><b>${it.name}</b> ${it.brand ? `<small style="color:#666;">(${it.brand})</small>` : ''}</td>
                        <td style="text-align:center;">${it.estQty} ${it.unit || 'Pcs'}</td>
                        <td style="text-align:right;">৳${it.estSell.toLocaleString()}</td>
                        <td style="text-align:right; font-weight:bold;">৳${itemTotal.toLocaleString()}</td>
                    </tr>
                `;
            });

            printArea.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #f59e0b; padding-bottom:12px; margin-bottom:15px; font-family:'Hind Siliguri',sans-serif;">
                    <div style="display:flex; gap:12px; align-items:center;">
                        ${shop.logo ? `<img src="${shop.logo}" style="width:55px; height:55px; border-radius:10px; object-fit:cover;">` : ''}
                        <div>
                            <h2 style="font-size:20px; margin:0; color:#0f172a;">${shop.name}</h2>
                            <p style="font-size:11px; color:#64748b; margin:2px 0;">${shop.address || ''}</p>
                            ${shop.phone ? `<p style="font-size:11px; color:#64748b; margin:0;">📞 ${shop.phone}</p>` : ''}
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <div style="background:#f59e0b; color:white; font-size:11px; font-weight:700; padding:3px 12px; border-radius:12px; display:inline-block; margin-bottom:4px;">PRICE QUOTATION</div>
                        <div style="font-size:11px; color:#334155;">Date: <b>${new Date().toLocaleDateString('en-GB')}</b></div>
                        ${validUntil ? `<div style="font-size:10.5px; color:#b45309; font-weight:600;">Valid Until: ${validUntil}</div>` : ''}
                    </div>
                </div>

                <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px 14px; margin-bottom:15px; font-family:'Hind Siliguri',sans-serif; font-size:12px;">
                    <span style="font-size:10px; color:#64748b; text-transform:uppercase; font-weight:700;">Quotation For:</span><br>
                    <strong style="font-size:14px; color:#0f172a;">${clientName}</strong>
                    ${clientPhone ? `<span style="color:#64748b; margin-left:10px;">📞 ${clientPhone}</span>` : ''}
                </div>

                <table>
                    <thead>
                        <tr>
                            <th style="width:30px;">#</th>
                            <th>Item Description</th>
                            <th style="width:70px; text-align:center;">Qty</th>
                            <th style="width:90px; text-align:right;">Unit Price (Tk)</th>
                            <th style="width:100px; text-align:right;">Total (Tk)</th>
                        </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                    <tfoot>
                        <tr style="background:#fffbeb; font-weight:800; font-size:13px;">
                            <td colspan="4" style="text-align:right; color:#b45309;">Grand Total:</td>
                            <td style="text-align:right; color:#b45309;">৳${totalSell.toLocaleString()}</td>
                        </tr>
                    </tfoot>
                </table>

                <div style="margin-top:12px; font-size:11px; color:#475569; font-family:'Hind Siliguri',sans-serif;">
                    <b>In Words:</b> ${numberToWordsBDT(totalSell)}
                </div>

                <div class="print-signatures">
                    <div>Client Acceptance: __________________</div>
                    <div>Authorized Signature: __________________</div>
                </div>
            `;

            window.print();
        };

        // --- EXPORT TO EXCEL ---
        window.exportToExcel = () => {
            if(Object.keys(estimateCart).length === 0) return alert("Quotation is empty!");
            const clientName = document.getElementById('qClientName').value.trim() || 'Client';
            const { totalSell } = calculateSummary();
            const filename = `Quotation_${clientName}_${new Date().toISOString().split('T')[0]}.xls`;

            let rowsHtml = '';
            Object.values(estimateCart).forEach((it, idx) => {
                rowsHtml += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${it.name}</td>
                        <td>${it.brand || ''}</td>
                        <td>${it.estQty}</td>
                        <td>${it.unit || 'Pcs'}</td>
                        <td>${it.estSell}</td>
                        <td>${it.estSell * it.estQty}</td>
                    </tr>
                `;
            });

            const excelTemplate = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"></head>
                <body>
                    <h2 style="text-align:center;">${SHOP_NAME}</h2>
                    <p style="text-align:center;">Price Quotation for: <b>${clientName}</b></p>
                    <table border="1">
                        <thead>
                            <tr style="background:#fef3c7; font-weight:bold;">
                                <th>SL</th>
                                <th>Item Description</th>
                                <th>Brand</th>
                                <th>Qty</th>
                                <th>Unit</th>
                                <th>Unit Price (Tk)</th>
                                <th>Total (Tk)</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                        <tfoot>
                            <tr style="font-weight:bold; background:#fffbeb;">
                                <td colspan="6" align="right">Grand Total:</td>
                                <td>${totalSell}</td>
                            </tr>
                        </tfoot>
                    </table>
                </body>
                </html>
            `;

            const blob = new Blob(['\ufeff' + excelTemplate], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- BARCODE SCANNER ---
        window.startScanner = () => {
            document.getElementById('scannerModal').style.display = 'flex';
            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 280, height: 140 }, disableFlip: false };
            
            html5QrcodeScanner.start({ facingMode: "environment" }, config, (decodedText) => {
                window.stopScanner();
                const audio = new Audio('https://www.soundjay.com/button/beep-07.wav'); audio.play().catch(e=>{});
                document.getElementById('searchInput').value = decodedText;
                document.getElementById('searchInput').dispatchEvent(new Event('input'));
            }).catch(err => { alert("Camera error: " + err); window.stopScanner(); });
        };
        
        window.stopScanner = () => {
            if(html5QrcodeScanner) { html5QrcodeScanner.stop().then(() => { document.getElementById('scannerModal').style.display = 'none'; }); } 
            else { document.getElementById('scannerModal').style.display = 'none'; }
        };
    </script>
</body>
</html>
