<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <title>Sales Book - Poysha POS</title>
    
    <meta name="theme-color" content="#0B4A3E">

    <script>
        const loggedInUser = localStorage.getItem('tempUserPhone') || sessionStorage.getItem('tempUserPhone') || localStorage.getItem('userPhone');
        const activeShopId = localStorage.getItem('activeShopId');
        if (!loggedInUser) window.location.replace("index.html");
        else if (!activeShopId) window.location.replace("dashboard.html");
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0B4A3E; --secondary: #D4A017; --bg-color: #f3f4f6;
            --white: #ffffff; --text-dark: #1f2937; --text-light: #6b7280;
            --danger: #ef4444; --success: #10b981; --warning: #f59e0b; --blue: #3b82f6; --purple: #8b5cf6;
            --border-radius: 16px; --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-dark); overflow-x: hidden; padding-bottom: 30px; position: relative; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Header */
        .app-header {
            position: relative; padding: 20px 20px 45px 20px; color: white; 
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; 
            z-index: 50; box-shadow: 0 10px 20px rgba(11, 74, 62, 0.24); overflow: hidden;
        }
        .header-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--primary) 0%, #12604F 100%); z-index: 1; }
        #dynamicThemeContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: hidden; }
        
        .header-top { position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-title { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
        .header-title a { color: white; text-decoration: none; }
        
        .header-actions { display: flex; gap: 8px; }
        .btn-header { background: rgba(255,255,255,0.2); border: none; padding: 8px 12px; border-radius: 10px; color: white; font-size: 12px; font-weight: 600; cursor: pointer; backdrop-filter: blur(5px); display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-header:active { transform: scale(0.95); }

        /* Filter */
        .filter-card { background: var(--white); border-radius: 16px; padding: 15px; margin: -25px 15px 15px 15px; box-shadow: var(--shadow); position: relative; z-index: 60; border: 1px solid #f8fafc; }
        .filter-row { display: flex; gap: 10px; align-items: flex-end; }
        .date-input { flex: 1; }
        .date-input label { display: block; font-size: 10px; font-weight: 700; color: var(--text-light); margin-bottom: 3px; text-transform: uppercase; }
        .date-input input { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 12px; outline: none; background: #f8fafc; color: var(--text-dark); font-family: inherit;}
        .date-input input:focus { border-color: var(--primary); background: white; }
        .btn-filter { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; width: 40px; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(11, 74, 62, 0.24); }

        .search-box { position: relative; margin-top: 10px; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .search-box input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 12px; outline: none; background: #f8fafc; font-family: inherit; }
        .search-box input:focus { border-color: var(--primary); background: white; }

        .quick-presets { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
        .preset-chip { padding: 4px 12px; border-radius: 16px; font-size: 11px; font-weight: 600; background: #f1f5f9; color: var(--text-dark); border: none; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .preset-chip.active { background: var(--primary); color: white; }

        /* Summary */
        .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0 15px; margin-bottom: 15px; gap: 8px; }
        .sum-box { background: var(--white); padding: 12px 6px; border-radius: 12px; text-align: center; box-shadow: var(--shadow); border: 1px solid #f8fafc; }
        .sum-title { font-size: 9.5px; font-weight: 700; color: var(--text-light); text-transform: uppercase; }
        .sum-val { font-size: 14px; font-weight: 800; margin-top: 2px; }

        /* List */
        .history-list { padding: 0 15px; display: flex; flex-direction: column; gap: 12px; }
        .history-card { background: var(--white); border-radius: 14px; padding: 15px; box-shadow: var(--shadow); position: relative; overflow: hidden; border-left: 4px solid var(--success); border-top: 1px solid #f8fafc; border-right: 1px solid #f8fafc; border-bottom: 1px solid #f8fafc; }
        .history-card.has-due { border-left-color: var(--danger); }
        
        .hc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px dashed #e5e7eb; padding-bottom: 10px; }
        .hc-supp { font-size: 14px; font-weight: 700; color: var(--text-dark); }
        .hc-date { font-size: 11px; color: var(--text-light); font-weight: 500; }
        .hc-inv { font-size: 10px; background: #f1f5f9; padding: 2px 6px; border-radius: 6px; font-family: monospace; font-weight: 600; margin-top: 4px; display: inline-block; color: var(--text-dark); }

        .hc-body { display: flex; justify-content: space-between; align-items: flex-end; }
        .hc-items { font-size: 12px; color: var(--text-light); font-weight: 600; }
        .hc-amt-box { text-align: right; }
        .hc-total { font-size: 16px; font-weight: 800; color: var(--text-dark); line-height: 1; }
        .hc-paid { font-size: 11px; color: var(--success); font-weight: 600; margin-top: 4px; }
        .hc-due { font-size: 11px; color: var(--danger); font-weight: 600; margin-top: 2px; }

        .btn-view { background: #f8fafc; border: 1px solid #e5e7eb; width: 100%; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 600; color: var(--primary); margin-top: 10px; cursor: pointer; transition: 0.2s; }
        
        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: white; width: 100%; max-width: 450px; border-radius: 16px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .btn-close { background: white; border: 1px solid #e5e7eb; width: 30px; height: 30px; border-radius: 50%; color: var(--text-light); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { padding: 10px; border-radius: 10px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-edit { background: #e0e7ff; color: #0B4A3E; grid-column: span 2;}
        .btn-chalan { background: #f1f5f9; color: var(--text-dark); }
        .btn-bill { background: #fef3c7; color: #d97706; }
        .btn-quo { background: #dbeafe; color: #2563eb; grid-column: span 2; }
        .btn-delete { background: #fee2e2; color: var(--danger); grid-column: span 2; }

        /* Edit Form Elements */
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-light); margin-bottom: 4px; text-transform: uppercase; }
        .input-field { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; background: #f8fafc; }
        .input-field:focus { border-color: var(--primary); background: white; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Customer Dropdown */
        .custom-dropdown-container { position: relative; }
        .custom-dropdown-list { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto; z-index: 1000; display: none; margin-top: 5px; }
        .dropdown-item-cust { padding: 12px 15px; border-bottom: 1px solid #f3f4f6; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-dark); display: flex; justify-content: space-between; align-items: center; }
        .dropdown-item-cust:hover { background: #f0f5ff; color: var(--primary); }
        
        .item-row { background: white; padding: 12px; border: 1px solid #f1f5f9; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .item-row-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700; font-size: 13px; color: var(--text-dark); }
        .item-controls { display: flex; gap: 10px; align-items: center; }
        
        .qty-box { display: flex; align-items: center; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
        .qty-btn { width: 28px; height: 28px; border: none; background: transparent; font-weight: bold; cursor: pointer; color: var(--text-dark); }
        .qty-input { width: 40px; text-align: center; border: none; background: transparent; font-weight: 700; font-size: 13px; outline: none; border-left: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; }
        
        .rate-box { flex: 1; display: flex; align-items: center; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0 8px; }
        .rate-box span { font-size: 11px; color: var(--text-light); font-weight: bold; margin-right: 5px; }
        .rate-input { width: 100%; border: none; background: transparent; font-weight: 700; font-size: 13px; outline: none; padding: 6px 0; color: var(--primary); }

        .btn-remove-item { background: #fee2e2; border: none; color: var(--danger); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-save-changes { width: 100%; background: var(--success); color: white; padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

        /* Product Search Dropdown */
        .e-search-results { position: absolute; left: 0; top: 100%; width: 100%; background: white; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto; z-index: 1000; margin-top: 5px; display: none; }
        .e-search-item { padding: 10px 15px; border-bottom: 1px solid #f3f4f6; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
        .e-search-item:hover { background: #f0f5ff; }

        /* Print Specific CSS */
        @media print {
            @page { size: A4 portrait; margin: 8mm; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .no-print { display: none !important; }
            #printAreaHolder { display: block !important; }
            #printAreaHolder table { width: 100% !important; border-collapse: collapse !important; }
            #printAreaHolder thead { display: table-header-group !important; }
            #printAreaHolder tfoot { display: table-row-group !important; }
            #printAreaHolder tr { page-break-inside: avoid !important; break-inside: avoid !important; }
            #printAreaHolder th, #printAreaHolder td { border: 1px solid #000000 !important; padding: 6px 8px !important; font-size: 10.5px !important; color: black !important; }
            #printAreaHolder th { background: #f1f5f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-signatures { page-break-inside: avoid !important; margin-top: 30px; display: flex; justify-content: space-between; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="app-header no-print" id="header-container">
        <div class="header-bg"></div>
        <div id="dynamicThemeContainer"></div>
        <div class="header-top">
            <div class="header-title">
                <a href="home.html"><i class="fas fa-arrow-left"></i></a>
                <span>Sales Book</span>
            </div>
            <div class="header-actions">
                <button onclick="exportToExcel()" class="btn-header" style="background:#16a34a;"><i class="fas fa-file-excel"></i> Excel</button>
                <button onclick="printSalesReport()" class="btn-header"><i class="fas fa-print"></i> Print / PDF</button>
            </div>
        </div>
    </div>

    <div class="filter-card no-print">
        <div class="filter-row">
            <div class="date-input">
                <label>From Date</label>
                <input type="date" id="dateFrom">
            </div>
            <div class="date-input">
                <label>To Date</label>
                <input type="date" id="dateTo">
            </div>
            <button onclick="loadHistory()" class="btn-filter"><i class="fas fa-search"></i></button>
        </div>

        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search customer or invoice no..." oninput="renderList()">
        </div>

        <div class="quick-presets">
            <button class="preset-chip active" onclick="setPreset('this_month', this)">চলতি মাস</button>
            <button class="preset-chip" onclick="setPreset('last_month', this)">গত মাস</button>
            <button class="preset-chip" onclick="setPreset('today', this)">আজকের দিন</button>
            <button class="preset-chip" onclick="setPreset('all_time', this)">সব সময় (All)</button>
        </div>
    </div>

    <div class="summary-bar no-print">
        <div class="sum-box">
            <div class="sum-title">Total Sales</div>
            <div class="sum-val text-success" id="sumTotal">৳0</div>
        </div>
        <div class="sum-box">
            <div class="sum-title text-danger">Total Due</div>
            <div class="sum-val text-danger" id="sumDue">৳0</div>
        </div>
        <div class="sum-box">
            <div class="sum-title" style="color:var(--purple);">Est. Profit</div>
            <div class="sum-val" style="color:var(--purple);" id="sumProfit">৳0</div>
        </div>
    </div>

    <div id="loading" class="no-print" style="text-align: center; padding: 40px; color: var(--text-light); font-weight: 600; font-size: 13px;">
        <i class="fas fa-spinner fa-spin" style="font-size: 24px; color: var(--primary); margin-bottom: 10px;"></i><br>Loading Sales...
    </div>

    <div class="history-list no-print" id="historyList"></div>

    <!-- Manage Sale Modal -->
    <div class="modal-overlay no-print" id="manageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size: 16px; font-weight: 700; margin: 0;">Manage Sale</h3>
                <button onclick="closeModal('manageModal')" class="btn-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div style="background: #f8fafc; padding: 12px; border-radius: 12px; margin-bottom: 15px; font-size: 12px;">
                    <p style="margin:0 0 5px 0;">Customer: <strong id="mCustomer"></strong></p>
                    <p style="margin:0 0 5px 0;">Invoice No: <strong id="mInvoice"></strong></p>
                    <p style="margin:0;">Date: <strong id="mDate"></strong></p>
                </div>
                
                <div style="border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px;">
                    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px;"><span>Bill Total:</span> <strong id="mTotal" style="font-size: 14px;"></strong></div>
                    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: var(--success);"><span>Paid Amount:</span> <strong id="mPaid"></strong></div>
                    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; color: var(--danger); border-top: 1px dashed #cbd5e1; padding-top: 8px; margin-top: 8px;"><span>Due Amount:</span> <span id="mDue"></span></div>
                    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-top: 8px; color: var(--warning); font-weight: 700; border-top: 1px dashed #cbd5e1; padding-top: 8px;">
                        <span>Estimated Profit:</span> <span id="mProfit"></span>
                    </div>
                </div>

                <div class="action-grid">
                    <button class="action-btn btn-edit" onclick="openEditModal()"><i class="fas fa-edit"></i> Edit Sale (পরিবর্তন করুন)</button>
                    <button class="action-btn btn-chalan" onclick="printDirectDocument('chalan')"><i class="fas fa-file-alt"></i> Print Chalan</button>
                    <button class="action-btn btn-bill" onclick="printDirectDocument('bill')"><i class="fas fa-file-invoice-dollar"></i> Print Bill</button>
                    <button class="action-btn btn-quo" onclick="printDirectDocument('quotation')"><i class="fas fa-file-contract"></i> Print Quotation</button>
                    <button class="action-btn btn-delete" onclick="deleteFullSale()"><i class="fas fa-trash-alt"></i> Delete Full Sale</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Sale Modal -->
    <div class="modal-overlay no-print" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size: 16px; font-weight: 700; margin: 0;">Edit Sale Details</h3>
                <button onclick="closeModal('editModal')" class="btn-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" style="background: #f3f4f6;">
                <div style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: var(--shadow);">
                    <div class="grid-2">
                        <div class="input-group custom-dropdown-container" style="margin-bottom: 0;">
                            <label>Customer Name</label>
                            <input type="text" id="eCustomer" class="input-field" placeholder="Search customer..." autocomplete="off">
                            <div id="eCustomerDropdown" class="custom-dropdown-list"></div>
                        </div>
                        <div class="input-group" style="margin-bottom: 0;">
                            <label>Date</label>
                            <input type="date" id="eDate" class="input-field">
                        </div>
                    </div>
                </div>

                <div style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: var(--shadow); position: relative;">
                    <div class="input-group" style="margin-bottom: 0;">
                        <label>Add New Product</label>
                        <input type="text" id="eProductSearch" class="input-field" placeholder="Search by name or barcode...">
                    </div>
                    <div id="eSearchResults" class="e-search-results"></div>
                </div>

                <div id="editItemsList"></div>
                
                <div style="background: white; padding: 15px; border-radius: 12px; margin-top: 15px; box-shadow: var(--shadow);">
                    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px;"><span>New Subtotal:</span> <strong id="eSubtotal"></strong></div>
                    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px; color: var(--danger); align-items: center;">
                        <span>Discount:</span> 
                        <input type="number" id="eDiscount" oninput="calculateEditSummary()" style="width:70px; padding:6px; text-align:right; border:1px solid #ccc; border-radius:6px; outline:none;">
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; margin-bottom: 5px; border-top: 1px dashed #e5e7eb; padding-top: 10px;">
                        <span>New Bill Total:</span> <span id="eTotal" style="color: var(--primary);"></span>
                    </div>
                    <div style="font-size: 11px; text-align: center; border-top: 1px dotted #cbd5e1; padding-top: 10px; margin-top: 10px;" id="eMessage"></div>
                </div>
                
                <button id="btnSaveChanges" onclick="saveEditedSale()" class="btn-save-changes">Save Updates & Sync Data</button>
            </div>
        </div>
    </div>

    <!-- Container for Browser Printing -->
    <div id="printAreaHolder" style="display:none;"></div>

    <script type="module">
        import { rtdb, ref as rtdbRef, onValue as rtdbOnValue, get, update, push, remove } from './firebase_config.js';
        import { runTransaction, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        import { getShopBranding, renderPremiumDocument } from './invoice_kit.js';
        
        const SHOP_ID = localStorage.getItem('activeShopId');
        const SHOP_NAME = localStorage.getItem('activeShopName') || 'Poysha POS Store';

        let allRecords = [];
        let filteredRecords = [];
        let currentSale = null;
        let editingSaleData = null; 
        let allProducts = []; 
        let allCustomers = []; 

        window.onload = () => {
            // Theme Sync
            rtdbOnValue(rtdbRef(rtdb, `global_settings/header_theme`), (snap) => {
                const themeCode = snap.exists() ? snap.val().code : null;
                if (themeCode && themeCode.trim() !== "") {
                    document.getElementById('dynamicThemeContainer').innerHTML = themeCode;
                    document.body.classList.add('has-theme');
                } else {
                    document.getElementById('dynamicThemeContainer').innerHTML = "";
                    document.body.classList.remove('has-theme');
                }
            });

            // Load Customers
            const customersQuery = query(rtdbRef(rtdb, 'contacts/customers'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(customersQuery, (snap) => {
                allCustomers = [{ name: 'Local (Walk-in)', phone: '' }]; 
                if(snap.exists()){
                    Object.values(snap.val()).forEach(c => allCustomers.push(c));
                }
            });

            // Load Products
            const productsQuery = query(rtdbRef(rtdb, 'product_list'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(productsQuery, (snap) => {
                if(snap.exists()) {
                    allProducts = Object.entries(snap.val())
                        .map(([id, val]) => ({ id, ...val }))
                        .filter(p => !p.is_deleted);
                }
            });

            setPreset('this_month');

            // Load Sales History
            const salesQuery = query(rtdbRef(rtdb, 'sales_history'), orderByChild('shop_id'), equalTo(SHOP_ID));
            rtdbOnValue(salesQuery, (snapshot) => {
                document.getElementById('loading').style.display = 'none';
                if (snapshot.exists()) {
                    allRecords = Object.entries(snapshot.val())
                        .map(([id, val]) => ({ id, ...val }))
                        .reverse();
                } else { allRecords = []; }
                loadHistory(); 
            });
        };

        window.setPreset = (type, btn = null) => {
            if (btn) {
                document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
            }

            const now = new Date();
            let start, end;

            if (type === 'today') {
                start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
            } else if (type === 'last_month') {
                start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                end = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59);
            } else if (type === 'all_time') {
                start = new Date(2020, 0, 1);
                end = new Date(now.getFullYear() + 2, 11, 31, 23, 59, 59);
            } else { // this_month
                start = new Date(now.getFullYear(), now.getMonth(), 1);
                end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
            }

            document.getElementById('dateFrom').value = start.toISOString().split('T')[0];
            document.getElementById('dateTo').value = end.toISOString().split('T')[0];

            if (allRecords.length > 0) loadHistory();
        };

        window.loadHistory = () => {
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            if(!dateFrom || !dateTo) return;

            const startStr = new Date(dateFrom).setHours(0,0,0,0);
            const endStr = new Date(dateTo).setHours(23,59,59,999);

            filteredRecords = allRecords.filter(r => {
                const saleDate = r.created_at || (r.date ? new Date(r.date).getTime() : 0);
                return saleDate >= startStr && saleDate <= endStr;
            });
            renderList();
        };

        window.renderList = () => {
            const listEl = document.getElementById('historyList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            listEl.innerHTML = '';
            
            let recordsToDisplay = filteredRecords;
            if(searchTerm) {
                recordsToDisplay = filteredRecords.filter(r => 
                    (r.customer_name && r.customer_name.toLowerCase().includes(searchTerm)) ||
                    (r.customer && r.customer.toLowerCase().includes(searchTerm)) ||
                    (r.invoice_no && r.invoice_no.toLowerCase().includes(searchTerm))
                );
            }

            let totalSales = 0, totalDue = 0, totalProfit = 0;

            if (recordsToDisplay.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-light); font-weight: 600;"><i class="fas fa-box-open" style="font-size: 40px; color: #cbd5e1; margin-bottom: 10px;"></i><br>No sales records found.</div>`;
            } else {
                recordsToDisplay.forEach(r => {
                    const tot = Number(r.total_amount || 0);
                    const due = Number(r.due_amount || 0);
                    const prof = Number(r.total_profit || 0);

                    totalSales += tot;
                    totalDue += due;
                    totalProfit += prof;

                    const hasDue = due > 0;
                    const d = new Date(r.created_at || r.date);
                    
                    const html = `
                    <div class="history-card ${hasDue ? 'has-due' : ''}">
                        <div class="hc-header">
                            <div>
                                <div class="hc-supp">${r.customer_name || r.customer || 'Walk-in Customer'}</div>
                                <div class="hc-inv">INV: ${r.invoice_no || 'N/A'}</div>
                            </div>
                            <div class="hc-date">${d.toLocaleDateString('en-GB')} ${d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                        </div>
                        <div class="hc-body">
                            <div class="hc-items"><i class="fas fa-box" style="color: #cbd5e1;"></i> ${r.items ? r.items.length : 0} Items</div>
                            <div class="hc-amt-box">
                                <div class="hc-total">৳${tot.toLocaleString()}</div>
                                <div class="hc-paid">Received: ৳${Number(r.paid_amount || 0).toLocaleString()}</div>
                                ${hasDue ? `<div class="hc-due">Due: ৳${due.toLocaleString()}</div>` : ''}
                            </div>
                        </div>
                        <button onclick="openManageModal('${r.id}')" class="btn-view">Manage Sale</button>
                    </div>`;
                    listEl.insertAdjacentHTML('beforeend', html);
                });
            }

            document.getElementById('sumTotal').innerText = `৳${totalSales.toLocaleString()}`;
            document.getElementById('sumDue').innerText = `৳${totalDue.toLocaleString()}`;
            document.getElementById('sumProfit').innerText = `৳${totalProfit.toLocaleString()}`;
        };

        window.openManageModal = (id) => {
            currentSale = allRecords.find(x => x.id === id);
            if(!currentSale) return;

            document.getElementById('mCustomer').innerText = currentSale.customer_name || currentSale.customer || 'Walk-in';
            document.getElementById('mInvoice').innerText = currentSale.invoice_no;
            document.getElementById('mDate').innerText = new Date(currentSale.created_at || currentSale.date).toLocaleString('en-GB');
            document.getElementById('mTotal').innerText = `৳${Number(currentSale.total_amount || 0).toLocaleString()}`;
            document.getElementById('mPaid').innerText = `৳${Number(currentSale.paid_amount || 0).toLocaleString()}`;
            document.getElementById('mDue').innerText = `৳${Number(currentSale.due_amount > 0 ? currentSale.due_amount : 0).toLocaleString()}`;
            document.getElementById('mProfit').innerText = `৳${Number(currentSale.total_profit || 0).toLocaleString()}`;

            document.getElementById('manageModal').style.display = 'flex';
        };

        window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; };

        // --- DIRECT PRINT FOR CHALAN / BILL / QUOTATION ---
        window.printDirectDocument = async (type) => {
            if(!currentSale) return;
            const shop = await getShopBranding(SHOP_ID);
            const custName = currentSale.customer_name || currentSale.customer || 'Walk-in';
            const invNo = currentSale.invoice_no || 'N/A';
            const dDate = new Date(currentSale.created_at || currentSale.date).toLocaleDateString('en-GB');

            let html = '';
            if (type === 'chalan') {
                const items = (currentSale.items || []).map(item => ({
                    name: item.name, brand: item.brand, unit: item.unit || 'Pcs', qty: item.qty, rate: 0, amount: 0
                }));
                html = renderPremiumDocument({
                    docType: 'INVOICE', docNo: `CHALLAN-${invNo.replace('INV-', '')}`, docDate: dDate,
                    shop: shop, partyLabel: 'Delivered To', partyName: custName, items: items,
                    subtotal: 0, discount: 0, total: 0, paid: null, due: null,
                    extraNote: 'Delivery Challan — prices not shown', footerNote: 'Please verify items upon receipt.'
                }).replace(/৳0/g, '—');
            } else {
                const items = (currentSale.items || []).map(item => {
                    const rate = item.sellRate || item.rate || 0;
                    return { name: item.name, brand: item.brand, unit: item.unit || 'Pcs', qty: item.qty, rate: rate, amount: rate * item.qty };
                });
                const isQuo = type === 'quotation';
                html = renderPremiumDocument({
                    docType: isQuo ? 'QUOTATION' : 'INVOICE',
                    docNo: isQuo ? `QUO-${invNo.replace('INV-', '')}` : invNo, docDate: dDate, shop: shop,
                    partyLabel: isQuo ? 'Quotation For' : 'Bill To', partyName: custName, items: items,
                    subtotal: currentSale.subtotal || currentSale.total_amount, discount: currentSale.discount || 0,
                    total: currentSale.total_amount, paid: isQuo ? null : currentSale.paid_amount, due: isQuo ? null : currentSale.due_amount,
                    footerNote: isQuo ? 'This is an estimate only.' : 'Thank you for your business!'
                });
            }

            const printHolder = document.getElementById('printAreaHolder');
            printHolder.innerHTML = html;
            window.print();
        };

        // --- FULL EDIT LOGIC ---
        window.openEditModal = () => {
            if(!currentSale) return;
            editingSaleData = JSON.parse(JSON.stringify(currentSale)); 
            if(!editingSaleData.items) editingSaleData.items = [];
            
            document.getElementById('eCustomer').value = editingSaleData.customer_name || editingSaleData.customer || "";
            
            let dString = "";
            if (editingSaleData.date) {
                dString = editingSaleData.date.includes('-') ? editingSaleData.date : new Date(editingSaleData.date).toISOString().split('T')[0];
            } else if (editingSaleData.created_at) {
                dString = new Date(editingSaleData.created_at).toISOString().split('T')[0];
            }
            document.getElementById('eDate').value = dString;
            document.getElementById('eDiscount').value = editingSaleData.discount || 0;
            
            document.getElementById('eProductSearch').value = "";
            document.getElementById('eSearchResults').style.display = "none";

            renderEditItems();
            document.getElementById('editModal').style.display = 'flex';
        };

        const eCustInput = document.getElementById('eCustomer');
        const eCustDropdown = document.getElementById('eCustomerDropdown');

        function renderEditCustomerDropdown(filterText = '') {
            eCustDropdown.innerHTML = '';
            const filtered = allCustomers.filter(c => 
                c.name.toLowerCase().includes(filterText.toLowerCase()) || 
                (c.phone && c.phone.includes(filterText))
            );

            if(filtered.length === 0) {
                eCustDropdown.innerHTML = '<div style="padding:10px; text-align:center; color:#9ca3af; font-size:12px;">No customers found</div>';
            } else {
                filtered.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'dropdown-item-cust';
                    div.innerHTML = `<span>${c.name}</span> <span style="font-size:10px; color:#6b7280;">${c.phone || ''}</span>`;
                    div.onclick = () => {
                        eCustInput.value = c.name;
                        eCustDropdown.style.display = 'none';
                    };
                    eCustDropdown.appendChild(div);
                });
            }
            eCustDropdown.style.display = 'block';
        }

        eCustInput.addEventListener('focus', () => renderEditCustomerDropdown(eCustInput.value));
        eCustInput.addEventListener('input', (e) => renderEditCustomerDropdown(e.target.value));

        document.addEventListener('click', (e) => {
            if(!eCustInput.contains(e.target) && !eCustDropdown.contains(e.target)) {
                eCustDropdown.style.display = 'none';
            }
        });

        document.getElementById('eProductSearch').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const resBox = document.getElementById('eSearchResults');
            resBox.innerHTML = '';
            
            if(term === '') { resBox.style.display = 'none'; return; }
            
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(term) || 
                (p.barcode && p.barcode.toString().toLowerCase().includes(term))
            ).slice(0, 15);
            
            if(filtered.length > 0) {
                resBox.style.display = 'block';
                filtered.forEach(p => {
                    resBox.innerHTML += `
                    <div class="e-search-item" onclick="addEditItem('${p.id}')">
                        <span>${p.name}</span>
                        <span style="color:var(--primary);">৳${p.sell_price || 0}</span>
                    </div>`;
                });
            } else {
                resBox.style.display = 'none';
            }
        });

        window.addEditItem = (id) => {
            const product = allProducts.find(p => p.id === id);
            if(product) {
                const existingIndex = editingSaleData.items.findIndex(i => i.id === id);
                if(existingIndex >= 0) {
                    editingSaleData.items[existingIndex].qty += 1;
                } else {
                    editingSaleData.items.unshift({ 
                        id: product.id, name: product.name, brand: product.brand || '',
                        qty: 1, sellRate: product.sell_price || 0, rate: product.sell_price || 0,
                        buyRate: product.buy_price || 0, unit: product.unit || 'Pcs'
                    });
                }
                renderEditItems();
                document.getElementById('eProductSearch').value = '';
                document.getElementById('eSearchResults').style.display = 'none';
            }
        };

        function renderEditItems() {
            const list = document.getElementById('editItemsList');
            list.innerHTML = '';
            
            editingSaleData.items.forEach((item, index) => {
                const rate = item.sellRate || item.rate || 0;
                list.innerHTML += `
                <div class="item-row">
                    <div class="item-row-header">
                        <span>${item.name}</span>
                        <button onclick="removeEditItem(${index})" class="btn-remove-item"><i class="fas fa-trash"></i></button>
                    </div>
                    <div class="item-controls">
                        <div class="qty-box">
                            <button onclick="changeEditQty(${index}, -1)" class="qty-btn">-</button>
                            <input type="number" value="${item.qty}" class="qty-input" onchange="manualQtyUpdate(${index}, this.value)">
                            <button onclick="changeEditQty(${index}, 1)" class="qty-btn">+</button>
                        </div>
                        <div class="rate-box">
                            <span>Rate: ৳</span>
                            <input type="number" value="${rate}" class="rate-input" onchange="changeEditRate(${index}, this.value)">
                        </div>
                    </div>
                </div>`;
            });
            window.calculateEditSummary();
        }

        window.changeEditQty = (index, change) => {
            const newQty = editingSaleData.items[index].qty + change;
            if(newQty > 0) { editingSaleData.items[index].qty = newQty; renderEditItems(); }
        };

        window.manualQtyUpdate = (index, val) => {
            const newQty = Number(val);
            if(newQty > 0) { editingSaleData.items[index].qty = newQty; renderEditItems(); }
        };

        window.changeEditRate = (index, val) => {
            const newRate = Number(val) || 0;
            editingSaleData.items[index].sellRate = newRate;
            editingSaleData.items[index].rate = newRate;
            window.calculateEditSummary();
        };

        window.removeEditItem = (index) => {
            editingSaleData.items.splice(index, 1); renderEditItems();
        };

        window.calculateEditSummary = () => {
            let subtotal = 0;
            editingSaleData.items.forEach(item => { 
                subtotal += (item.qty * (item.sellRate || item.rate || 0));
            });
            
            const discount = Number(document.getElementById('eDiscount').value) || 0;
            const total = subtotal - discount;
            
            editingSaleData.subtotal = subtotal;
            editingSaleData.discount = discount;
            editingSaleData.total_amount = total;

            document.getElementById('eSubtotal').innerText = `৳${subtotal.toLocaleString()}`;
            document.getElementById('eTotal').innerText = `৳${total.toLocaleString()}`;

            const oldPaid = Number(currentSale.paid_amount || 0);
            let newDue = total - oldPaid;
            let msg = "";

            if(newDue < 0) {
                msg = `<span style="color:var(--danger)"><i class="fas fa-exclamation-triangle"></i> New bill is less than paid amount. <b>৳${Math.abs(newDue)}</b> will be refunded.</span>`;
            } else if(newDue > 0) {
                msg = `<span style="color:var(--warning)"><i class="fas fa-info-circle"></i> Customer due will become: <b>৳${newDue}</b></span>`;
            } else {
                msg = `<span style="color:var(--success)"><i class="fas fa-check-circle"></i> Bill is perfectly settled.</span>`;
            }
            document.getElementById('eMessage').innerHTML = msg;
        };

        window.saveEditedSale = async () => {
            if(editingSaleData.items.length === 0) return alert("All items removed. Please use 'Delete Full Sale' instead.");

            const btn = document.getElementById('btnSaveChanges');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving & Syncing...'; btn.disabled = true;

            try {
                const newCustName = document.getElementById('eCustomer').value.trim() || 'Local (Walk-in)';
                const newDateStr = document.getElementById('eDate').value;
                const actionDate = new Date(newDateStr);
                const now = new Date();
                actionDate.setHours(now.getHours(), now.getMinutes(), now.getSeconds());
                const finalTimestamp = actionDate.getTime();
                
                const oldCustName = currentSale.customer_name || currentSale.customer || '';
                const oldPaid = Number(currentSale.paid_amount || 0);
                const newTotal = editingSaleData.total_amount;
                let newPaid = oldPaid;
                let newDue = newTotal - newPaid;
                let refundAmt = 0;

                if (newDue < 0) {
                    refundAmt = Math.abs(newDue); 
                    newPaid = newTotal;
                    newDue = 0;
                }

                let newProfit = 0;
                editingSaleData.items.forEach(item => {
                    let buyRate = Number(item.buyRate || item.buy_price || item.purchaseRate || 0);
                    let sellRate = Number(item.sellRate || item.rate || 0);
                    newProfit += (sellRate - buyRate) * item.qty;
                });
                newProfit -= editingSaleData.discount;

                editingSaleData.customer = newCustName;
                editingSaleData.customer_name = newCustName;
                editingSaleData.date = newDateStr;
                editingSaleData.created_at = finalTimestamp;
                editingSaleData.paid_amount = newPaid;
                editingSaleData.due_amount = newDue;
                editingSaleData.total_profit = newProfit;

                // Adjust Stock
                for(let oldItem of (currentSale.items || [])) {
                    await runTransaction(rtdbRef(rtdb, `product_list/${oldItem.id}/stock`), (stock) => (stock || 0) + oldItem.qty);
                }
                for(let newItem of editingSaleData.items) {
                    await runTransaction(rtdbRef(rtdb, `product_list/${newItem.id}/stock`), (stock) => (stock || 0) - newItem.qty);
                }

                // Adjust Cashbox
                if(refundAmt > 0) {
                    await runTransaction(rtdbRef(rtdb, `cash_settings/${SHOP_ID}/current_balance`), (bal) => (bal || 0) - refundAmt);
                    await push(rtdbRef(rtdb, 'cash_transactions'), {
                        shop_id: SHOP_ID, type: 'cash_out', source: 'sales_return',
                        amount: refundAmt, note: `Refund for Edit: ${currentSale.invoice_no}`, created_at: finalTimestamp
                    });
                }

                // Adjust Due Book
                const oldDue = Number(currentSale.due_amount || 0);
                if(oldDue > 0 && oldCustName && oldCustName !== "Local (Walk-in)") {
                    const dueSnap = await get(query(rtdbRef(rtdb, 'due_book'), orderByChild('shop_id'), equalTo(SHOP_ID)));
                    let oldDueKey = null;
                    if(dueSnap.exists()){
                        Object.entries(dueSnap.val()).forEach(([key, val]) => {
                            if(val.name === oldCustName && val.type === 'receive') oldDueKey = key;
                        });
                    }
                    if(oldDueKey) {
                        await runTransaction(rtdbRef(rtdb, `due_book/${oldDueKey}/current_due`), (due) => {
                            let d = (due || 0) - oldDue; return d < 0 ? 0 : d;
                        });
                    }
                }
                
                if(newDue > 0 && newCustName !== "Local (Walk-in)") {
                    const dueSnap = await get(query(rtdbRef(rtdb, 'due_book'), orderByChild('shop_id'), equalTo(SHOP_ID)));
                    let newDueKey = null;
                    if(dueSnap.exists()){
                        Object.entries(dueSnap.val()).forEach(([key, val]) => {
                            if(val.name === newCustName && val.type === 'receive') newDueKey = key;
                        });
                    }
                    if(newDueKey) {
                        await runTransaction(rtdbRef(rtdb, `due_book/${newDueKey}/current_due`), (due) => (due || 0) + newDue);
                    } else {
                        await push(rtdbRef(rtdb, 'due_book'), {
                            shop_id: SHOP_ID, type: 'receive', name: newCustName,
                            total_amount: newDue, current_due: newDue, created_at: finalTimestamp
                        });
                    }
                }

                await update(rtdbRef(rtdb, `sales_history/${currentSale.id}`), editingSaleData);

                alert("Sale updated successfully! Stock, Cash and Dues are adjusted.");
                closeModal('editModal');
                closeModal('manageModal');

            } catch(e) { alert("Error saving edits: " + e.message); }
            finally { btn.innerHTML = 'Save Updates & Sync Data'; btn.disabled = false; }
        };

        window.deleteFullSale = async () => {
            if(!confirm("Are you SURE you want to delete this entire sale? \n\n- Items return to stock.\n- Paid amount is refunded.\n- Customer Due is removed.")) return;

            try {
                for(let item of (currentSale.items || [])) {
                    await runTransaction(rtdbRef(rtdb, `product_list/${item.id}/stock`), (stock) => (stock || 0) + item.qty);
                }

                const paid = Number(currentSale.paid_amount || 0);
                if(paid > 0) {
                    await runTransaction(rtdbRef(rtdb, `cash_settings/${SHOP_ID}/current_balance`), (bal) => (bal || 0) - paid);
                    await push(rtdbRef(rtdb, 'cash_transactions'), {
                        shop_id: SHOP_ID, type: 'cash_out', source: 'sales_return',
                        amount: paid, note: `Refund for Cancelled Invoice: ${currentSale.invoice_no}`, created_at: Date.now()
                    });
                }

                const due = Number(currentSale.due_amount || 0);
                const custName = currentSale.customer_name || currentSale.customer || '';
                if(due > 0 && custName && custName !== "Local (Walk-in)") {
                    const dueSnap = await get(query(rtdbRef(rtdb, 'due_book'), orderByChild('shop_id'), equalTo(SHOP_ID)));
                    let dueKey = null;
                    if(dueSnap.exists()){
                        Object.entries(dueSnap.val()).forEach(([key, val]) => {
                            if(val.name === custName && val.type === 'receive') dueKey = key;
                        });
                    }
                    if(dueKey) {
                        await runTransaction(rtdbRef(rtdb, `due_book/${dueKey}/current_due`), (curr) => {
                            let n = (curr || 0) - due; return n < 0 ? 0 : n;
                        });
                    }
                }

                await remove(rtdbRef(rtdb, `sales_history/${currentSale.id}`));
                alert("Sale deleted completely.");
                closeModal('manageModal');

            } catch(e) { alert("Error deleting sale: " + e.message); }
        };

        // --- DIRECT CLEAN PRINT (SALES REPORT) ---
        window.printSalesReport = async () => {
            if(filteredRecords.length === 0) return alert("প্রিন্ট করার জন্য কোনো তথ্য পাওয়া যায়নি!");

                rowsHtml += `
                    <tr>

                            <b>${r.customer_name || r.customer || 'Walk-in'}</b><br>
                            <span style="font-size:10px; color:#555;">INV: ${r.invoice_no || 'N/A'}</span>
                        </td>
                        <td style="text-align:center;">${dDate}</td>
                        <td style="line-height:1.4;">${itemsStr}</td>
                        <td style="text-align:right; font-weight:bold;">৳${tot.toLocaleString()}</td>
                        <td style="text-align:right; color:#16a34a;">৳${paid.toLocaleString()}</td>
                        <td style="text-align:right; color:#dc2626; font-weight:bold;">৳${due.toLocaleString()}</td>
                    </tr>
                `;
            });

            printArea.innerHTML = `
                <div style="text-align: center; margin-bottom: 15px; font-family:'Hind Siliguri',sans-serif;">
                    ${shop.logo ? `<img src="${shop.logo}" style="width:55px; height:55px; border-radius:10px; object-fit:cover; margin-bottom:5px;">` : ''}
                    <h2 style="font-size: 20px; margin: 0; color:#0f172a;">${shop.name}</h2>
                    <p style="font-size: 11px; color: #64748b; margin: 2px 0;">${shop.address || ''}</p>
                    <div style="display:inline-block; background:#0B4A3E; color:white; font-size:12px; font-weight:700; padding:2px 12px; border-radius:12px; margin-top:4px;">বিক্রয় খাতা রিপোর্ট (Sales Report)</div>
                    <p style="font-size: 11px; color: #334155; margin-top: 4px; font-weight:600;">তারিখ: <b>${dateFrom}</b> থেকে <b>${dateTo}</b></p>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th style="width:30px;">#</th>
                            <th>কাস্টমার ও ইনভয়েস</th>
                            <th style="width:80px; text-align:center;">তারিখ</th>
                            <th>বিক্রিত পণ্যের বিবরণী</th>
                            <th style="text-align:right; width:80px;">মোট বিল</th>
                            <th style="text-align:right; width:80px;">আদায়</th>
                            <th style="text-align:right; width:80px;">বকেয়া</th>
                        </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4" style="text-align:right; font-weight:bold;">সর্বমোট (Total):</td>
                            <td style="text-align:right; font-weight:bold; color:#0B4A3E;">৳${sumT.toLocaleString()}</td>
                            <td style="text-align:right; font-weight:bold; color:#16a34a;">৳${sumP.toLocaleString()}</td>
                            <td style="text-align:right; font-weight:bold; color:#dc2626;">৳${sumD.toLocaleString()}</td>
                        </tr>
                    </tfoot>
                </table>

                <div class="print-signatures">
                    <div>প্রস্তুতকারী স্বাক্ষর: ____________________</div>
                    <div>হিসাবরক্ষক স্বাক্ষর: ____________________</div>
                    <div>কর্তৃপক্ষের স্বাক্ষর: ____________________</div>
                </div>
            `;

            window.print();
        };

        // --- EXPORT TO EXCEL ---
        window.exportToExcel = () => {
            if(filteredRecords.length === 0) return alert("এক্সেলে ডাউনলোড করার মতো কোনো তথ্য নেই!");
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            const filename = `Sales_Book_${dateFrom}_to_${dateTo}.xls`;

            let rowsHtml = '';
            let sumT = 0, sumP = 0, sumD = 0, sumProfit = 0;

            filteredRecords.forEach((r, idx) => {
                const tot = Number(r.total_amount || 0);
                const paid = Number(r.paid_amount || 0);
                const due = Number(r.due_amount || 0);
                const prof = Number(r.total_profit || 0);
                sumT += tot; sumP += paid; sumD += due; sumProfit += prof;
                
                const dDate = new Date(r.created_at || r.date).toLocaleDateString('en-GB');
                
                let itemsStr = "";
                if(r.items && r.items.length > 0) {
                    r.items.forEach(i => {
                        itemsStr += `${i.name} (${i.qty} ${i.unit || 'pcs'} @ ${i.rate || i.sellRate}); `;
                    });
                }

                rowsHtml += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${r.customer_name || r.customer || 'Walk-in'}</td>
                        <td>${r.invoice_no || 'N/A'}</td>
                        <td>${dDate}</td>
                        <td>${itemsStr}</td>
                        <td>${tot}</td>
                        <td>${paid}</td>
                        <td>${due}</td>
                        <td>${prof}</td>
                        <td>${r.payment_method || 'Cash'}</td>
                    </tr>
                `;
            });

            const excelTemplate = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"></head>
                <body>
                    <h2 style="text-align:center;">${SHOP_NAME}</h2>
                    <p style="text-align:center;">বিক্রয় খাতা রিপোর্ট (${dateFrom} থেকে ${dateTo})</p>
                    <table border="1">
                        <thead>
                            <tr style="background:#dcfce7; font-weight:bold;">
                                <th>SL</th>
                                <th>Customer Name</th>
                                <th>Invoice No</th>
                                <th>Date</th>
                                <th>Items Sold</th>
                                <th>Total Bill (Tk)</th>
                                <th>Received Amount (Tk)</th>
                                <th>Due Amount (Tk)</th>
                                <th>Profit (Tk)</th>
                                <th>Payment Method</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                        <tfoot>
                            <tr style="font-weight:bold; background:#f1f5f9;">
                                <td colspan="5" align="right">Total:</td>
                                <td>${sumT}</td>
                                <td>${sumP}</td>
                                <td>${sumD}</td>
                                <td>${sumProfit}</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </body>
                </html>
            `;

            const blob = new Blob(['\ufeff' + excelTemplate], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>
</html>
